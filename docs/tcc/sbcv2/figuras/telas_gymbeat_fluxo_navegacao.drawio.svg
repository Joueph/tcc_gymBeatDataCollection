<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700"
     style="background-color: #0F172A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;telas_gymbeat_fluxo_navegacao&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <!-- Phone frame shadow -->
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="navArrow" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#3B82F6"/>
    </marker>

    <!-- Dark Phone screen gradient -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161922"/>
      <stop offset="100%" style="stop-color:#0B0D10"/>
    </linearGradient>

    <!-- Green Pulse Glow for live HUD -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="560" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#F8FAFC">
    Telas Principais do GymBeat e Fluxo de Navegação do Treino ao Vivo
  </text>
  <text x="560" y="52" text-anchor="middle" font-size="11.5" fill="#94A3B8">
    Interface desenvolvida em React Native 0.81, Expo SDK 54 e Expo Router v6 (Tema Escuro Otimizado)
  </text>

  <!-- ==================== PHONE 1: LOGIN / ONBOARDING ==================== -->
  <g transform="translate(40, 75)" filter="url(#phoneShadow)">
    <!-- Device Frame -->
    <rect width="230" height="470" rx="32" fill="#1E232F" stroke="#334155" stroke-width="2.5"/>
    <rect x="6" y="6" width="218" height="458" rx="26" fill="url(#screenBg)"/>

    <!-- Dynamic Island -->
    <rect x="75" y="14" width="68" height="15" rx="7.5" fill="#000000"/>

    <!-- Status Bar -->
    <text x="26" y="25" font-size="9" font-weight="bold" fill="#FFFFFF">9:41</text>
    <circle cx="190" cy="22" r="3" fill="#FFFFFF"/>
    <rect x="196" y="19" width="12" height="6" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="198" y="21" width="7" height="3" fill="#FFFFFF"/>

    <!-- App Logo & Branding -->
    <g transform="translate(109, 65)">
      <circle cx="0" cy="0" r="16" fill="#3B82F6"/>
      <path d="M -8,0 L -3,0 L -1,-6 L 2,6 L 4,-3 L 6,0 L 8,0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="109" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">GymBeat</text>
    <text x="109" y="106" text-anchor="middle" font-size="8" fill="#64748B">Coleta e Detecção Inercial</text>

    <!-- Onboarding Progress (5 steps) -->
    <text x="109" y="126" text-anchor="middle" font-size="8.5" font-weight="600" fill="#38BDF8">Etapa 2 de 5 · TCLE &amp; Perfil</text>
    <g transform="translate(45, 134)">
      <rect x="0" y="0" width="22" height="3" rx="1.5" fill="#38BDF8"/>
      <rect x="27" y="0" width="22" height="3" rx="1.5" fill="#38BDF8"/>
      <rect x="54" y="0" width="22" height="3" rx="1.5" fill="#334155"/>
      <rect x="81" y="0" width="22" height="3" rx="1.5" fill="#334155"/>
      <rect x="108" y="0" width="22" height="3" rx="1.5" fill="#334155"/>
    </g>

    <!-- Form Cards -->
    <g transform="translate(18, 150)">
      <!-- Field 1 -->
      <rect width="182" height="42" rx="8" fill="#1A1D23" stroke="#2D333B"/>
      <text x="12" y="16" font-size="8" fill="#94A3B8">NOME COMPLETO</text>
      <text x="12" y="32" font-size="10" font-weight="500" fill="#F1F5F9">Voluntário de Pesquisa</text>

      <!-- Field 2 -->
      <g transform="translate(0, 48)">
        <rect width="88" height="42" rx="8" fill="#1A1D23" stroke="#2D333B"/>
        <text x="10" y="16" font-size="8" fill="#94A3B8">IDADE</text>
        <text x="10" y="32" font-size="10" font-weight="500" fill="#F1F5F9">24 anos</text>
      </g>
      <g transform="translate(94, 48)">
        <rect width="88" height="42" rx="8" fill="#1A1D23" stroke="#2D333B"/>
        <text x="10" y="16" font-size="8" fill="#94A3B8">SEXO</text>
        <text x="10" y="32" font-size="10" font-weight="500" fill="#F1F5F9">Masculino</text>
      </g>

      <!-- Field 3: TCLE Consent -->
      <g transform="translate(0, 96)">
        <rect width="182" height="52" rx="8" fill="#1A1D23" stroke="#2D333B"/>
        <circle cx="16" cy="26" r="6" fill="#10B981"/>
        <path d="M 13,26 L 15,28 L 19,23" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        <text x="28" y="20" font-size="8" font-weight="bold" fill="#F1F5F9">Consentimento TCLE Aceito</text>
        <text x="28" y="32" font-size="7.5" fill="#64748B">Coleta anônima para fins acadêmicos</text>
        <text x="28" y="42" font-size="7.5" fill="#64748B">Conforme comitê de ética em pesquisa</text>
      </g>

      <!-- Button -->
      <g transform="translate(0, 160)">
        <rect width="182" height="36" rx="10" fill="#3B82F6"/>
        <text x="91" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Continuar Cadastro</text>
      </g>
    </g>

    <text x="109" y="440" text-anchor="middle" font-size="8" fill="#475569">Rota: `/login` (Expo Router)</text>
  </g>

  <!-- Nav Arrow 1 -> 2 -->
  <path d="M 275,310 L 315,310" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#navArrow)"/>
  <rect x="272" y="280" width="46" height="18" rx="4" fill="#1E293B" stroke="#3B82F6"/>
  <text x="295" y="292" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#60A5FA">Auth</text>

  <!-- ==================== PHONE 2: DASHBOARD ==================== -->
  <g transform="translate(320, 75)" filter="url(#phoneShadow)">
    <rect width="230" height="470" rx="32" fill="#1E232F" stroke="#334155" stroke-width="2.5"/>
    <rect x="6" y="6" width="218" height="458" rx="26" fill="url(#screenBg)"/>

    <rect x="75" y="14" width="68" height="15" rx="7.5" fill="#000000"/>
    <text x="26" y="25" font-size="9" font-weight="bold" fill="#FFFFFF">9:41</text>

    <!-- Header -->
    <g transform="translate(18, 48)">
      <text x="0" y="14" font-size="12" font-weight="bold" fill="#F1F5F9">GymBeat Dashboard</text>
      <rect x="130" y="2" width="55" height="16" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
      <circle cx="138" cy="10" r="2.5" fill="#10B981"/>
      <text x="144" y="13" font-size="7.5" font-weight="bold" fill="#10B981">Watch OK</text>
    </g>

    <!-- HealthKit Banner -->
    <g transform="translate(18, 74)">
      <rect width="182" height="44" rx="8" fill="#1A1D23" stroke="#2D333B"/>
      <text x="10" y="16" font-size="8" fill="#94A3B8">RESUMO HOJE (HealthKit)</text>
      <text x="10" y="32" font-size="11" font-weight="bold" fill="#F1F5F9">480 kcal · 42 min · 6.200 passos</text>
    </g>

    <!-- Exercise Picker Header -->
    <text x="18" y="138" font-size="9.5" font-weight="bold" fill="#94A3B8">EXERCÍCIOS PARA COLETA</text>

    <!-- Exercise Cards -->
    <g transform="translate(18, 146)">
      <!-- Selected Card: Agachamento -->
      <rect width="182" height="48" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="12" y="20" font-size="10.5" font-weight="bold" fill="#60A5FA">Agachamento Livre</text>
      <text x="12" y="34" font-size="8" fill="#94A3B8">Pernas · 3 séries gravadas hoje</text>
      <circle cx="162" cy="24" r="8" fill="#3B82F6"/>
      <path d="M 159,20 L 166,24 L 159,28 Z" fill="#FFFFFF"/>

      <!-- Card 2: Supino Reto -->
      <g transform="translate(0, 54)">
        <rect width="182" height="42" rx="8" fill="#1A1D23" stroke="#2D333B"/>
        <text x="12" y="18" font-size="9.5" font-weight="600" fill="#E2E8F0">Supino Reto</text>
        <text x="12" y="30" font-size="7.5" fill="#64748B">Peito · 4 séries</text>
      </g>

      <!-- Card 3: Levantamento Terra -->
      <g transform="translate(0, 102)">
        <rect width="182" height="42" rx="8" fill="#1A1D23" stroke="#2D333B"/>
        <text x="12" y="18" font-size="9.5" font-weight="600" fill="#E2E8F0">Levantamento Terra</text>
        <text x="12" y="30" font-size="7.5" fill="#64748B">Posterior · 2 séries</text>
      </g>

      <!-- Start Live Button -->
      <g transform="translate(0, 154)">
        <rect width="182" height="38" rx="10" fill="#10B981"/>
        <text x="91" y="23" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">▶ Iniciar Série ao Vivo</text>
      </g>
    </g>

    <text x="109" y="440" text-anchor="middle" font-size="8" fill="#475569">Rota: `/` (Index)</text>
  </g>

  <!-- Nav Arrow 2 -> 3 -->
  <path d="M 555,310 L 595,310" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#navArrow)"/>
  <rect x="552" y="280" width="46" height="18" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="575" y="292" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#34D399">Iniciar</text>

  <!-- ==================== PHONE 3: TREINO AO VIVO (HERO SCREEN) ==================== -->
  <g transform="translate(600, 75)" filter="url(#phoneShadow)">
    <rect width="230" height="470" rx="32" fill="#1E232F" stroke="#10B981" stroke-width="3"/>
    <rect x="6" y="6" width="218" height="458" rx="26" fill="url(#screenBg)"/>

    <rect x="75" y="14" width="68" height="15" rx="7.5" fill="#000000"/>
    <text x="26" y="25" font-size="9" font-weight="bold" fill="#FFFFFF">9:41</text>

    <!-- Live Header -->
    <g transform="translate(18, 46)">
      <text x="0" y="12" font-size="11" font-weight="bold" fill="#F1F5F9">Agachamento · Série 1</text>
      <rect x="125" y="1" width="60" height="16" rx="8" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="0.8"/>
      <circle cx="133" cy="9" r="2.5" fill="#DC2626"/>
      <text x="140" y="12" font-size="7" font-weight="bold" fill="#EF4444">REC · 25 Hz</text>
    </g>

    <!-- Real-Time Vitals Ribbon -->
    <g transform="translate(18, 68)">
      <rect width="182" height="30" rx="6" fill="#1A1D23" stroke="#2D333B"/>
      <text x="12" y="18" font-size="8" fill="#EF4444">💓 142 bpm</text>
      <text x="75" y="18" font-size="8" fill="#F59E0B">🔥 84 kcal</text>
      <text x="135" y="18" font-size="8" fill="#38BDF8">🫁 98%</text>
    </g>

    <!-- LIVE REPETITION COUNTER CARD (STAR COMPONENT) -->
    <g transform="translate(18, 106)" filter="url(#greenGlow)">
      <rect width="182" height="110" rx="14" fill="#062E1F" stroke="#10B981" stroke-width="2.5"/>

      <text x="91" y="22" text-anchor="middle" font-size="8.5" font-weight="bold" letter-spacing="1" fill="#34D399">
        REPETIÇÕES AO VIVO
      </text>

      <!-- 52px Monospace Tabular Reps -->
      <text x="91" y="75" text-anchor="middle" font-size="52" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
        08
      </text>

      <!-- Haptic Feedback Badge -->
      <rect x="36" y="85" width="110" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
      <text x="91" y="96" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#6EE7B7">
        ⚡ Vibração Tátil: 45 ms
      </text>
    </g>

    <!-- Mini Streaming Sparkline Signal -->
    <g transform="translate(18, 226)">
      <rect width="182" height="48" rx="8" fill="#1A1D23" stroke="#2D333B"/>
      <text x="8" y="12" font-size="7" fill="#64748B">Sinal Projetado PCA 1D (Streaming Causal):</text>
      <!-- Sparkline path -->
      <path d="M 10,32 Q 22,18 30,32 T 50,32 Q 62,14 70,32 T 90,32 Q 102,12 110,32 T 130,32 Q 142,10 150,32 T 172,32"
            fill="none" stroke="#10B981" stroke-width="1.8"/>
      <!-- Peak points -->
      <circle cx="26" cy="23" r="2.5" fill="#34D399"/>
      <circle cx="66" cy="20" r="2.5" fill="#34D399"/>
      <circle cx="106" cy="18" r="2.5" fill="#34D399"/>
      <circle cx="146" cy="16" r="2.5" fill="#34D399"/>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(18, 282)">
      <rect width="86" height="34" rx="8" fill="#334155"/>
      <text x="43" y="21" text-anchor="middle" font-size="9.5" font-weight="600" fill="#FFFFFF">⏸ Pausar</text>

      <g transform="translate(96, 0)">
        <rect width="86" height="34" rx="8" fill="#DC2626"/>
        <text x="43" y="21" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FFFFFF">⏹ Finalizar</text>
      </g>
    </g>

    <!-- Cadence info -->
    <g transform="translate(18, 324)">
      <rect width="182" height="24" rx="6" fill="#1A1D23"/>
      <text x="91" y="16" text-anchor="middle" font-size="8" fill="#94A3B8">Cadência: ~2,8 s/rep · Taxa BT: 4,4 Hz</text>
    </g>

    <text x="109" y="440" text-anchor="middle" font-size="8" fill="#10B981">Rota: `/live/[id]` (Destaque Principal)</text>
  </g>

  <!-- Nav Arrow 3 -> 4 -->
  <path d="M 835,310 L 875,310" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#navArrow)"/>
  <rect x="832" y="280" width="46" height="18" rx="4" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="855" y="292" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#A78BFA">Fim</text>

  <!-- ==================== PHONE 4: RESUMO DA SÉRIE ==================== -->
  <g transform="translate(880, 75)" filter="url(#phoneShadow)">
    <rect width="230" height="470" rx="32" fill="#1E232F" stroke="#334155" stroke-width="2.5"/>
    <rect x="6" y="6" width="218" height="458" rx="26" fill="url(#screenBg)"/>

    <rect x="75" y="14" width="68" height="15" rx="7.5" fill="#000000"/>
    <text x="26" y="25" font-size="9" font-weight="bold" fill="#FFFFFF">9:41</text>

    <!-- Header -->
    <g transform="translate(18, 48)">
      <circle cx="10" cy="10" r="10" fill="#10B981"/>
      <path d="M 6,10 L 9,13 L 14,7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="26" y="14" font-size="11.5" font-weight="bold" fill="#F1F5F9">Série Concluída!</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(18, 76)">
      <rect width="182" height="110" rx="10" fill="#1A1D23" stroke="#2D333B"/>

      <text x="12" y="22" font-size="9" fill="#94A3B8">Reps Detectadas (Streaming):</text>
      <text x="170" y="22" text-anchor="end" font-size="11" font-weight="bold" fill="#10B981">8 reps</text>

      <line x1="12" y1="32" x2="170" y2="32" stroke="#2D333B"/>
      <text x="12" y="48" font-size="9" fill="#94A3B8">Reps Declaradas (Atleta):</text>
      <text x="170" y="48" text-anchor="end" font-size="11" font-weight="bold" fill="#F1F5F9">8 reps</text>

      <line x1="12" y1="58" x2="170" y2="58" stroke="#2D333B"/>
      <text x="12" y="74" font-size="9" fill="#94A3B8">Duração Total:</text>
      <text x="170" y="74" text-anchor="end" font-size="10" fill="#F1F5F9">22,4 s</text>

      <line x1="12" y1="84" x2="170" y2="84" stroke="#2D333B"/>
      <text x="12" y="100" font-size="9" fill="#94A3B8">Taxa de Acerto:</text>
      <text x="170" y="100" text-anchor="end" font-size="10" font-weight="bold" fill="#10B981">100% (Erro 0)</text>
    </g>

    <!-- Sync status box -->
    <g transform="translate(18, 198)">
      <rect width="182" height="54" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="12" y="18" font-size="8.5" font-weight="bold" fill="#A5B4FC">☁️ Sincronização em Nuvem</text>
      <text x="12" y="32" font-size="7.5" fill="#C7D2FE">Persistido no SQLite local</text>
      <text x="12" y="44" font-size="7.5" fill="#C7D2FE">Enviado ao Cloud Firestore (batch 20)</text>
    </g>

    <!-- Action Button -->
    <g transform="translate(18, 264)">
      <rect width="182" height="38" rx="10" fill="#3B82F6"/>
      <text x="91" y="23" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Próxima Série / Salvar</text>
    </g>

    <text x="109" y="440" text-anchor="middle" font-size="8" fill="#475569">Rota: `/workout/[id]`</text>
  </g>

  <!-- ==================== BOTTOM FEATURE BAR ==================== -->
  <g transform="translate(40, 570)">
    <rect width="1070" height="95" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="25" font-size="11" font-weight="bold" fill="#F8FAFC">Destaques da Implementação Frontend:</text>

    <!-- Feature 1 -->
    <g transform="translate(25, 38)">
      <rect width="240" height="42" rx="6" fill="#0F172A"/>
      <text x="12" y="16" font-size="8.5" font-weight="bold" fill="#60A5FA">Tipografia Tabular (52 px)</text>
      <text x="12" y="30" font-size="7.5" fill="#94A3B8">`fontVariant: ["tabular-nums"]` evita oscilação de largura durante contagem rápida.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(285, 38)">
      <rect width="240" height="42" rx="6" fill="#0F172A"/>
      <text x="12" y="16" font-size="8.5" font-weight="bold" fill="#34D399">Feedback Háptico Imediato</text>
      <text x="12" y="30" font-size="7.5" fill="#94A3B8">`Vibration.vibrate(45)` confirma cada repetição sem que o atleta precise olhar para o celular.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(545, 38)">
      <rect width="240" height="42" rx="6" fill="#0F172A"/>
      <text x="12" y="16" font-size="8.5" font-weight="bold" fill="#A78BFA">Expo Router v6</text>
      <text x="12" y="30" font-size="7.5" fill="#94A3B8">Roteamento por sistema de arquivos nativo (`/login`, `/`, `/live/[id]`, `/workout/[id]`).</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(805, 38)">
      <rect width="240" height="42" rx="6" fill="#0F172A"/>
      <text x="12" y="16" font-size="8.5" font-weight="bold" fill="#FBBF24">Design System Escuro</text>
      <text x="12" y="30" font-size="7.5" fill="#94A3B8">Contraste WCAG AAA com fundo `#0B0D10` para economia energética em telas OLED.</text>
    </g>
  </g>
</svg>
