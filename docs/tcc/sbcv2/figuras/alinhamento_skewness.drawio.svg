<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"alinhamento_skewness\"></diagram></mxfile>" -->

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    Alinhamento de Polaridade via Coeficiente de Assimetria (Skewness)
  </text>

  <!-- ===== LEFT: Before alignment (inverted) ===== -->
  <rect x="30" y="52" width="415" height="395" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="237" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">
    (a) Antes — Autovetor Arbitrário (γ₁ &lt; 0)
  </text>
  <text x="237" y="94" text-anchor="middle" font-size="10" fill="#4B5563" font-style="italic">
    Crista = fase excêntrica (INCORRETO)
  </text>

  <!-- Left Axes -->
  <line x1="65" y1="265" x2="415" y2="265" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="65" y1="395" x2="65" y2="115" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="425" y="269" font-size="10" font-weight="bold" fill="#111111">t</text>
  <text x="48" y="120" font-size="10" font-weight="bold" fill="#111111">p(t)</text>
  <text x="55" y="269" font-size="9" fill="#4B5563" text-anchor="end">0</text>

  <!-- Inverted signal: valleys where peaks should be (dashed) -->
  <path d="M 75,265 C 90,270 105,290 120,315 C 135,345 150,365 165,370
           C 180,373 190,365 205,335 C 220,305 235,265 255,235
           C 275,205 285,185 300,170 C 310,160 315,163 325,180
           C 335,200 345,235 360,275 C 375,315 385,350 395,365"
        fill="none" stroke="#4B5563" stroke-width="2.2" stroke-dasharray="6,3"/>

  <!-- Inverted peaks (hollow circles) -->
  <circle cx="165" cy="370" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="165" y="405" text-anchor="middle" font-size="9" fill="#374151">Concêntrica ↓ (vale)</text>

  <circle cx="300" cy="170" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="300" y="150" text-anchor="middle" font-size="9" fill="#374151">Excêntrica ↑ (crista falsa)</text>

  <!-- Problem annotation -->
  <rect x="75" y="402" width="325" height="28" rx="4" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
  <text x="237" y="420" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">
    [✗] Detector contaria excêntricas como repetições
  </text>

  <!-- Skewness value -->
  <rect x="315" y="105" width="115" height="30" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
  <text x="372" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">γ₁ = −0,83</text>

  <!-- ===== CENTER: Arrow showing correction ===== -->
  <g transform="translate(460, 210)">
    <circle cx="20" cy="20" r="20" fill="#111111" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="bold">→</text>
    <text x="20" y="55" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Se γ₁ &lt; 0:</text>
    <text x="20" y="68" text-anchor="middle" font-size="9" font-family="monospace" font-weight="bold" fill="#111111">v₁ ← −v₁</text>
  </g>

  <!-- ===== RIGHT: After alignment (correct) ===== -->
  <rect x="505" y="52" width="425" height="395" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="717" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">
    (b) Depois — Autovetor Alinhado (γ₁ &gt; 0)
  </text>
  <text x="717" y="94" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">
    Crista = fase concêntrica (CORRETO)
  </text>

  <!-- Right Axes -->
  <line x1="540" y1="265" x2="890" y2="265" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="540" y1="395" x2="540" y2="115" stroke="#111111" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="900" y="269" font-size="10" font-weight="bold" fill="#111111">t</text>
  <text x="522" y="120" font-size="10" font-weight="bold" fill="#111111">p(t)</text>
  <text x="530" y="269" font-size="9" fill="#4B5563" text-anchor="end">0</text>

  <!-- Correct signal: peaks at concentric phase (solid bold) -->
  <path d="M 550,265 C 565,260 580,240 595,215 C 610,185 625,165 640,160
           C 655,157 665,165 680,195 C 695,225 710,265 730,295
           C 750,325 760,345 775,360 C 785,370 790,367 800,350
           C 810,330 820,295 835,255 C 850,215 860,180 870,165"
        fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Correct peaks (solid black circles) -->
  <circle cx="640" cy="160" r="6" fill="#111111" stroke="#000000" stroke-width="2"/>
  <text x="640" y="142" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Concêntrica ↑ (crista)</text>

  <circle cx="870" cy="165" r="6" fill="#111111" stroke="#000000" stroke-width="2"/>
  <text x="870" y="147" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Concêntrica ↑</text>

  <!-- Correct valleys (hollow circles) -->
  <circle cx="775" cy="360" r="4.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="775" y="385" text-anchor="middle" font-size="9" fill="#374151">Excêntrica ↓</text>

  <!-- Success annotation -->
  <rect x="555" y="402" width="335" height="28" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.5"/>
  <text x="722" y="420" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">
    [✓] Detector de picos conta repetições corretamente
  </text>

  <!-- Skewness value -->
  <rect x="795" y="105" width="115" height="30" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.5"/>
  <text x="852" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">γ₁ = +0,83</text>
</svg>
