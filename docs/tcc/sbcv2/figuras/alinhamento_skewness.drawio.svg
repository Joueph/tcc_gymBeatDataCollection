<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;alinhamento_skewness&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">
    Alinhamento de Polaridade via Coeficiente de Assimetria (Skewness)
  </text>

  <!-- ===== LEFT: Before alignment (inverted) ===== -->
  <rect x="20" y="48" width="420" height="385" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="230" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2410C">
    (a) Antes — Autovetor Arbitrário (γ₁ &lt; 0)
  </text>
  <text x="230" y="90" text-anchor="middle" font-size="10" fill="#9A3412" font-style="italic">
    Crista = fase excêntrica (INCORRETO)
  </text>

  <!-- Left Axes -->
  <line x1="60" y1="260" x2="410" y2="260" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="60" y1="390" x2="60" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="420" y="265" font-size="10" fill="#333">t</text>
  <text x="45" y="115" font-size="10" fill="#333">p(t)</text>
  <text x="50" y="265" font-size="9" fill="#666" text-anchor="end">0</text>

  <!-- Inverted signal: valleys where peaks should be -->
  <path d="M 70,260 C 85,265 100,285 115,310 C 130,340 145,360 160,365
           C 175,368 185,360 200,330 C 215,300 230,260 250,230
           C 270,200 280,180 295,165 C 305,155 310,158 320,175
           C 330,195 340,230 355,270 C 370,310 380,345 390,360"
        fill="none" stroke="#EA580C" stroke-width="2.5"/>

  <!-- Inverted peaks (at wrong phase) -->
  <circle cx="160" cy="365" r="5" fill="#EA580C" stroke="#9A3412" stroke-width="1.5"/>
  <text x="160" y="400" text-anchor="middle" font-size="9" fill="#9A3412">Concêntrica ↓ (vale)</text>

  <circle cx="295" cy="165" r="5" fill="#EA580C" stroke="#9A3412" stroke-width="1.5"/>
  <text x="295" y="145" text-anchor="middle" font-size="9" fill="#9A3412">Excêntrica ↑ (crista)</text>

  <!-- Problem annotation -->
  <rect x="80" y="395" width="300" height="28" rx="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
  <text x="230" y="414" text-anchor="middle" font-size="10" font-weight="bold" fill="#9A3412">
    ✗ Detector de picos contaria excêntricas como reps
  </text>

  <!-- Skewness value -->
  <rect x="310" y="105" width="110" height="30" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="365" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">γ₁ = −0.83</text>

  <!-- ===== CENTER: Arrow showing correction ===== -->
  <rect x="440" y="210" width="40" height="40" rx="20" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  <text x="460" y="235" text-anchor="middle" font-size="18" fill="white" font-weight="bold">→</text>
  <text x="460" y="270" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">Se γ₁ &lt; 0:</text>
  <text x="460" y="283" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">v₁ ← −v₁</text>

  <!-- ===== RIGHT: After alignment (correct) ===== -->
  <rect x="480" y="48" width="420" height="385" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="690" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#16A34A">
    (b) Depois — Autovetor Alinhado (γ₁ &gt; 0)
  </text>
  <text x="690" y="90" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">
    Crista = fase concêntrica (CORRETO)
  </text>

  <!-- Right Axes -->
  <line x1="520" y1="260" x2="870" y2="260" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="520" y1="390" x2="520" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="880" y="265" font-size="10" fill="#333">t</text>
  <text x="505" y="115" font-size="10" fill="#333">p(t)</text>
  <text x="510" y="265" font-size="9" fill="#666" text-anchor="end">0</text>

  <!-- Correct signal: peaks at concentric phase -->
  <path d="M 530,260 C 545,255 560,235 575,210 C 590,180 605,160 620,155
           C 635,152 645,160 660,190 C 675,220 690,260 710,290
           C 730,320 740,340 755,355 C 765,365 770,362 780,345
           C 790,325 800,290 815,250 C 830,210 840,175 850,160"
        fill="none" stroke="#16A34A" stroke-width="2.5"/>

  <!-- Correct peaks -->
  <circle cx="620" cy="155" r="6" fill="#16A34A" stroke="#166534" stroke-width="2"/>
  <text x="620" y="138" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">Concêntrica ↑ (crista) ✓</text>

  <circle cx="850" cy="160" r="6" fill="#16A34A" stroke="#166534" stroke-width="2"/>
  <text x="850" y="143" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">Concêntrica ↑ ✓</text>

  <!-- Correct valleys -->
  <circle cx="755" cy="355" r="4" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  <text x="755" y="380" text-anchor="middle" font-size="9" fill="#92400E">Excêntrica ↓</text>

  <!-- Success annotation -->
  <rect x="540" y="395" width="300" height="28" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="690" y="414" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">
    ✓ Detector de picos conta repetições corretamente
  </text>

  <!-- Skewness value -->
  <rect x="770" y="105" width="110" height="30" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="825" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#16A34A">γ₁ = +0.83</text>
</svg>
