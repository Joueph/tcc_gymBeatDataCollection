<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;motor_streaming_vs_batch&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <filter id="dualShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <marker id="mArrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="mArrGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
    <marker id="mArrAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="mArrPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED"/>
    </marker>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#DBEAFE"/>
    </linearGradient>
    <linearGradient id="batchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="510" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">
    Coordenação de Motores: Streaming (Tempo Real) vs. Batch (Fallback Pós-Série)
  </text>
  <text x="510" y="46" text-anchor="middle" font-size="11" fill="#64748B">
    Arquitetura de dupla via em TypeScript (`StreamingRepetitionCounter` + `repetition-engine`)
  </text>

  <!-- ================= TOP: INPUT STREAM (Apple Watch) ================= -->
  <g transform="translate(360, 65)" filter="url(#dualShadow)">
    <rect width="300" height="50" rx="8" fill="#4F46E5" stroke="#4338CA" stroke-width="1.5"/>
    <text x="150" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">FLUXO INERCIAL APPLE WATCH</text>
    <text x="150" y="38" text-anchor="middle" font-size="9" font-family="monospace" fill="#C7D2FE">WCSession (Bluetooth LE · ~4,4 Hz)</text>
  </g>

  <!-- Dual Split Arrows -->
  <!-- Left branch to Streaming -->
  <path d="M 440,115 L 440,140 L 250,140 L 250,165" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#mArrBlue)"/>
  <rect x="270" y="125" width="140" height="18" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="340" y="137" text-anchor="middle" font-size="8" font-weight="bold" fill="#1E40AF">Amostra a Amostra (Push O(1))</text>

  <!-- Right branch to Storage / Batch -->
  <path d="M 580,115 L 580,140 L 770,140 L 770,165" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#mArrAmber)"/>
  <rect x="610" y="125" width="140" height="18" rx="4" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="680" y="137" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">Buffer Completo em Memória / DB</text>

  <!-- ================= LEFT COLUMN: MOTOR STREAMING (Principal) ================= -->
  <g transform="translate(40, 170)" filter="url(#dualShadow)">
    <rect width="420" height="300" rx="10" fill="url(#streamGrad)" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="30" rx="10 10 0 0" fill="#2563EB"/>
    <text x="210" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">
      MOTOR STREAMING (TEMPO REAL) — VIA PRIMÁRIA
    </text>

    <!-- Details Box -->
    <g transform="translate(15, 42)">
      <rect width="390" height="240" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>

      <text x="15" y="22" font-size="10.5" font-weight="bold" fill="#1E40AF">StreamingRepetitionCounter.ts</text>

      <text x="15" y="44" font-size="9" font-weight="600" fill="#334155">• Processamento Causal Online:</text>
      <text x="25" y="58" font-size="8.5" fill="#475569">Memória estática W = 35 amostras (CircularBuffer O(1))</text>

      <text x="15" y="76" font-size="9" font-weight="600" fill="#334155">• Projeção Dimensional:</text>
      <text x="25" y="90" font-size="8.5" fill="#475569">Moving PCA (25 iters Power Iteration) + Skewness</text>

      <text x="15" y="108" font-size="9" font-weight="600" fill="#334155">• Filtro Digital:</text>
      <text x="25" y="122" font-size="8.5" fill="#475569">IIR Biquad Forma Direta II Transposta (fc = 1,2 Hz)</text>

      <text x="15" y="140" font-size="9" font-weight="600" fill="#334155">• Detecção &amp; Histerese:</text>
      <text x="25" y="154" font-size="8.5" fill="#475569">Crista local instantânea + Janela Refratária (1,6 s)</text>

      <rect x="15" y="170" width="360" height="55" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
      <text x="195" y="188" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065F46">SAÍDA IMEDIATA DURANTE A SÉRIE:</text>
      <text x="195" y="204" text-anchor="middle" font-size="9" fill="#047857">Contador em tela (52 px) + Feedback tátil (45 ms)</text>
      <text x="195" y="218" text-anchor="middle" font-size="8.5" font-style="italic" fill="#059669">Latência: &lt; 0,05 ms por amostra</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MOTOR BATCH (Fallback) ================= -->
  <g transform="translate(560, 170)" filter="url(#dualShadow)">
    <rect width="420" height="300" rx="10" fill="url(#batchGrad)" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="30" rx="10 10 0 0" fill="#D97706"/>
    <text x="210" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">
      MOTOR BATCH (OFFLINE) — VIA DE FALLBACK
    </text>

    <!-- Details Box -->
    <g transform="translate(15, 42)">
      <rect width="390" height="240" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>

      <text x="15" y="22" font-size="10.5" font-weight="bold" fill="#92400E">repetition-engine.ts</text>

      <text x="15" y="44" font-size="9" font-weight="600" fill="#334155">• Processamento Não-Causal Pós-Série:</text>
      <text x="25" y="58" font-size="8.5" fill="#475569">Vetor completo com N amostras (toda a série)</text>

      <text x="15" y="76" font-size="9" font-weight="600" fill="#334155">• Filtragem Bidirecional (Zero-Phase):</text>
      <text x="25" y="90" font-size="8.5" fill="#475569">Butterworth forward-reverse (filtfilt) → Distorção de fase ZERO</text>

      <text x="15" y="108" font-size="9" font-weight="600" fill="#334155">• Síntese Híbrida 6D → 1D:</text>
      <text x="25" y="122" font-size="8.5" fill="#475569">80% Projeção PCA (Acc) + 20% Envelope Giroscópio</text>

      <text x="15" y="140" font-size="9" font-weight="600" fill="#334155">• Detecção por Proeminência:</text>
      <text x="25" y="154" font-size="8.5" fill="#475569">minProminenceFactor = 0,30 · Refratário 1,6 s</text>

      <rect x="15" y="170" width="360" height="55" rx="6" fill="#FEF3C7" stroke="#FCD34D"/>
      <text x="195" y="188" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400E">PAPEL NO SISTEMA:</text>
      <text x="195" y="204" text-anchor="middle" font-size="9" fill="#78350F">Acionado caso o streaming perca pacotes BT</text>
      <text x="195" y="218" text-anchor="middle" font-size="8.5" font-style="italic" fill="#B45309">Garante que nenhuma série termine com 0 repetições válidas</text>
    </g>
  </g>

  <!-- ================= MIDDLE DECISION GATE: onEndSet() ================= -->
  <g transform="translate(390, 485)" filter="url(#dualShadow)">
    <polygon points="120 0, 240 35, 120 70, 0 35" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5B21B6">Fim da Série</text>
    <text x="120" y="44" text-anchor="middle" font-size="8" font-family="monospace" fill="#7C3AED">streamingReps &gt; 0?</text>
  </g>

  <!-- Flow from Streaming to Decision -->
  <path d="M 250,470 L 250,520 L 385,520" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#mArrBlue)"/>

  <!-- Decision: YES -> Use Streaming Reps -->
  <path d="M 510,555 L 510,590 L 300,590" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#mArrGreen)"/>
  <rect x="420" y="565" width="80" height="18" rx="4" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="460" y="577" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#166534">SIM (Principal)</text>

  <!-- Decision: NO -> Trigger Batch -->
  <path d="M 630,520 L 770,520 L 770,475" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#mArrAmber)"/>
  <rect x="650" y="505" width="100" height="18" rx="4" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="700" y="517" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400E">NÃO (Chama Fallback)</text>

  <!-- ================= FINAL PERSISTENCE BLOCK ================= -->
  <g transform="translate(60, 565)" filter="url(#dualShadow)">
    <rect width="230" height="50" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <text x="115" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">CONSOLIDAÇÃO FINAL</text>
    <text x="115" y="36" text-anchor="middle" font-size="8.5" fill="#94A3B8">SQLite (`detected_reps`) + Firestore</text>
  </g>

  <!-- Connecting line from Batch to Final Persistence -->
  <path d="M 770,470 L 770,610 L 295,610" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mArrAmber)"/>
</svg>
