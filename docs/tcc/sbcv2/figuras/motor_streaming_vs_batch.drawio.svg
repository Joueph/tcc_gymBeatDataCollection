<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="1060" height="650"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"motor_streaming_vs_batch\"></diagram></mxfile>" -->

  <defs>
    <marker id="mArr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="530" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">
    Coordenação de Motores: Streaming (Tempo Real) vs. Batch (Fallback Pós-Série)
  </text>
  <text x="530" y="50" text-anchor="middle" font-size="11" fill="#4B5563">
    Arquitetura de dupla via em TypeScript (StreamingRepetitionCounter + repetition-engine)
  </text>

  <!-- ================= TOP: INPUT STREAM (Apple Watch) ================= -->
  <g transform="translate(370, 70)">
    <rect width="320" height="52" rx="6" fill="#111111" stroke="#000000" stroke-width="1.5"/>
    <text x="160" y="24" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">FLUXO INERCIAL APPLE WATCH</text>
    <text x="160" y="40" text-anchor="middle" font-size="9" font-family="monospace" fill="#E5E7EB">WCSession (Bluetooth · ~4,4 Hz)</text>
  </g>

  <!-- Dual Split Arrows -->
  <path d="M 450,122 L 450,145 L 260,145 L 260,170" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#mArr)"/>
  <rect x="280" y="132" width="150" height="18" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
  <text x="355" y="144" text-anchor="middle" font-size="8" font-weight="bold" fill="#111111">Amostra a Amostra (Push O(1))</text>

  <path d="M 610,122 L 610,145 L 800,145 L 800,170" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#mArr)"/>
  <rect x="635" y="132" width="150" height="18" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
  <text x="710" y="144" text-anchor="middle" font-size="8" font-weight="bold" fill="#111111">Buffer Completo / SQLite</text>

  <!-- ================= LEFT COLUMN: MOTOR STREAMING (Principal) ================= -->
  <g transform="translate(45, 175)">
    <rect width="430" height="305" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.2"/>
    <rect x="0" y="0" width="430" height="30" rx="8 8 0 0" fill="#111111"/>
    <text x="215" y="20" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">
      MOTOR STREAMING (TEMPO REAL) — VIA PRIMÁRIA
    </text>

    <!-- Details Box -->
    <g transform="translate(15, 42)">
      <rect width="400" height="245" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>

      <text x="15" y="24" font-size="10.5" font-weight="bold" fill="#111111">StreamingRepetitionCounter.ts</text>

      <text x="15" y="46" font-size="9" font-weight="bold" fill="#111111">• Processamento Causal Online:</text>
      <text x="25" y="60" font-size="8.5" fill="#374151">Memória estática W = 35 amostras (CircularBuffer O(1))</text>

      <text x="15" y="78" font-size="9" font-weight="bold" fill="#111111">• Projeção Dimensional:</text>
      <text x="25" y="92" font-size="8.5" fill="#374151">Moving PCA (25 iters Power Iteration) + Skewness</text>

      <text x="15" y="110" font-size="9" font-weight="bold" fill="#111111">• Filtro Digital:</text>
      <text x="25" y="124" font-size="8.5" fill="#374151">IIR Biquad Forma Direta II Transposta (fc = 1,2 Hz)</text>

      <text x="15" y="142" font-size="9" font-weight="bold" fill="#111111">• Detecção &amp; Histerese:</text>
      <text x="25" y="156" font-size="8.5" fill="#374151">Crista local instantânea + Janela Refratária (1,6 s)</text>

      <rect x="15" y="172" width="370" height="60" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <text x="200" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">SAÍDA IMEDIATA DURANTE A SÉRIE:</text>
      <text x="200" y="206" text-anchor="middle" font-size="9" fill="#111111">Contador em tela (52 px) + Feedback tátil (45 ms)</text>
      <text x="200" y="222" text-anchor="middle" font-size="8.5" font-style="italic" fill="#4B5563">Latência: &lt; 0,05 ms por amostra</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MOTOR BATCH (Fallback) ================= -->
  <g transform="translate(585, 175)">
    <rect width="430" height="305" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6,4"/>
    <rect x="0" y="0" width="430" height="30" rx="8 8 0 0" fill="#374151"/>
    <text x="215" y="20" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">
      MOTOR BATCH (OFFLINE) — VIA DE CONTINGÊNCIA
    </text>

    <!-- Details Box -->
    <g transform="translate(15, 42)">
      <rect width="400" height="245" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>

      <text x="15" y="24" font-size="10.5" font-weight="bold" fill="#111111">repetition-engine.ts</text>

      <text x="15" y="46" font-size="9" font-weight="bold" fill="#111111">• Processamento Não-Causal Pós-Série:</text>
      <text x="25" y="60" font-size="8.5" fill="#374151">Vetor completo com N amostras (toda a série gravada)</text>

      <text x="15" y="78" font-size="9" font-weight="bold" fill="#111111">• Filtragem Bidirecional (Zero-Phase):</text>
      <text x="25" y="92" font-size="8.5" fill="#374151">Butterworth forward-reverse (filtfilt) → Fase linear zero</text>

      <text x="15" y="110" font-size="9" font-weight="bold" fill="#111111">• Síntese Híbrida 6D → 1D:</text>
      <text x="25" y="124" font-size="8.5" fill="#374151">80% Projeção PCA (Acc) + 20% Envelope Giroscópio</text>

      <text x="15" y="142" font-size="9" font-weight="bold" fill="#111111">• Detecção por Proeminência:</text>
      <text x="25" y="156" font-size="8.5" fill="#374151">minProminenceFactor = 0,30 · Refratário 1,6 s</text>

      <rect x="15" y="172" width="370" height="60" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/>
      <text x="200" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">PAPEL NO SISTEMA:</text>
      <text x="200" y="206" text-anchor="middle" font-size="9" fill="#374151">Acionado caso o streaming sofra perda de pacotes BT</text>
      <text x="200" y="222" text-anchor="middle" font-size="8.5" font-style="italic" fill="#4B5563">Garante que nenhuma série encerre com contagem nula</text>
    </g>
  </g>

  <!-- ================= MIDDLE DECISION GATE: onEndSet() ================= -->
  <g transform="translate(410, 495)">
    <polygon points="120 0, 240 32, 120 64, 0 32" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">Fim da Série</text>
    <text x="120" y="42" text-anchor="middle" font-size="8" font-family="monospace" fill="#374151">streamingReps &gt; 0?</text>
  </g>

  <!-- Flow from Streaming to Decision -->
  <path d="M 260,480 L 260,527 L 405,527" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#mArr)"/>

  <!-- Decision: YES -> Use Streaming Reps -->
  <path d="M 530,559 L 530,595 L 315,595" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#mArr)"/>
  <rect x="435" y="570" width="85" height="18" rx="4" fill="#111111"/>
  <text x="477" y="582" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">SIM (Principal)</text>

  <!-- Decision: NO -> Trigger Batch -->
  <path d="M 650,527 L 800,527 L 800,485" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mArr)"/>
  <rect x="670" y="512" width="105" height="18" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
  <text x="722" y="524" text-anchor="middle" font-size="8" font-weight="bold" fill="#111111">NÃO (Fallback)</text>

  <!-- ================= FINAL PERSISTENCE BLOCK ================= -->
  <g transform="translate(65, 570)">
    <rect width="245" height="50" rx="6" fill="#F9FAFB" stroke="#111111" stroke-width="1.5"/>
    <text x="122" y="21" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">CONSOLIDAÇÃO FINAL</text>
    <text x="122" y="37" text-anchor="middle" font-size="8.5" fill="#374151">SQLite (detected_reps) + Firestore</text>
  </g>

  <!-- Connecting line from Batch to Final Persistence -->
  <path d="M 800,480 L 800,615 L 315,615" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mArr)"/>
</svg>
