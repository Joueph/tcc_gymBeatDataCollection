<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"filtro_iir_biquad_diagrama\"></diagram></mxfile>" -->

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    Filtro Causal IIR Biquad — Forma Direta II Transposta (Butterworth 2ª Ordem)
  </text>

  <!-- ===== LEFT: Block Diagram ===== -->
  <rect x="30" y="52" width="530" height="375" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
  <text x="295" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">
    (a) Diagrama de Blocos — DF-II Transposta
  </text>

  <!-- Input -->
  <text x="55" y="195" font-size="12" font-weight="bold" fill="#111111">x[n]</text>
  <line x1="85" y1="190" x2="120" y2="190" stroke="#111111" stroke-width="2" marker-end="url(#ar)"/>

  <!-- b0 multiplier -->
  <rect x="120" y="175" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="145" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">b₀</text>
  <line x1="170" y1="190" x2="210" y2="190" stroke="#111111" stroke-width="1.5"/>

  <!-- Summing junction 1 -->
  <circle cx="225" cy="190" r="15" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="225" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Σ</text>

  <!-- Output -->
  <line x1="240" y1="190" x2="315" y2="190" stroke="#111111" stroke-width="2" marker-end="url(#ar)"/>
  <text x="330" y="195" font-size="12" font-weight="bold" fill="#111111">y[n]</text>

  <!-- State w1 (delay z^-1 #1) -->
  <rect x="200" y="240" width="50" height="30" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.5"/>
  <text x="225" y="260" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">z⁻¹</text>
  <line x1="225" y1="205" x2="225" y2="240" stroke="#111111" stroke-width="1.5"/>
  <text x="245" y="232" font-size="9" fill="#4B5563">w₁</text>

  <!-- b1 path -->
  <line x1="145" y1="205" x2="145" y2="260" stroke="#111111" stroke-width="1"/>
  <rect x="90" y="247" width="40" height="26" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="110" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">b₁</text>
  <line x1="130" y1="260" x2="150" y2="260" stroke="#111111" stroke-width="1"/>

  <!-- -a1 path -->
  <line x1="300" y1="205" x2="300" y2="260" stroke="#111111" stroke-width="1"/>
  <rect x="260" y="247" width="50" height="26" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="285" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">−a₁</text>
  <line x1="260" y1="260" x2="250" y2="260" stroke="#111111" stroke-width="1"/>

  <!-- Summing junction w1 -->
  <circle cx="177" cy="260" r="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="177" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">+</text>

  <!-- State w2 (delay z^-1 #2) -->
  <rect x="200" y="310" width="50" height="30" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.5"/>
  <text x="225" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">z⁻¹</text>
  <line x1="225" y1="270" x2="225" y2="310" stroke="#111111" stroke-width="1.5"/>
  <text x="245" y="302" font-size="9" fill="#4B5563">w₂</text>

  <!-- b2 path -->
  <line x1="145" y1="260" x2="145" y2="330" stroke="#111111" stroke-width="1"/>
  <rect x="90" y="317" width="40" height="26" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="110" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">b₂</text>
  <line x1="130" y1="330" x2="150" y2="330" stroke="#111111" stroke-width="1"/>

  <!-- -a2 path -->
  <line x1="300" y1="260" x2="300" y2="330" stroke="#111111" stroke-width="1"/>
  <rect x="260" y="317" width="50" height="26" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="285" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">−a₂</text>
  <line x1="260" y1="330" x2="250" y2="330" stroke="#111111" stroke-width="1"/>

  <!-- Summing junction w2 -->
  <circle cx="177" cy="330" r="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="177" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">+</text>

  <!-- Equation -->
  <text x="295" y="395" text-anchor="middle" font-size="9.5" fill="#111111" font-style="italic">
    y[n] = b₀·x[n] + b₁·x[n−1] + b₂·x[n−2] − a₁·y[n−1] − a₂·y[n−2]
  </text>

  <!-- ===== RIGHT: Specifications ===== -->
  <rect x="580" y="52" width="350" height="375" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
  <text x="755" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">
    (b) Especificações do Filtro
  </text>

  <!-- Parameter table -->
  <rect x="600" y="90" width="310" height="28" fill="#E5E7EB"/>
  <text x="670" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Parâmetro</text>
  <text x="850" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Valor</text>
  <line x1="745" y1="90" x2="745" y2="285" stroke="#9CA3AF" stroke-width="1"/>

  <line x1="600" y1="118" x2="910" y2="118" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="135" text-anchor="middle" font-size="9.5" fill="#374151">Tipo</text>
  <text x="850" y="135" text-anchor="middle" font-size="9.5" fill="#111111">Butterworth (passa-baixa)</text>

  <line x1="600" y1="145" x2="910" y2="145" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="162" text-anchor="middle" font-size="9.5" fill="#374151">Ordem</text>
  <text x="850" y="162" text-anchor="middle" font-size="9.5" fill="#111111">2ª (seção biquadrática)</text>

  <line x1="600" y1="172" x2="910" y2="172" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="189" text-anchor="middle" font-size="9.5" fill="#374151">Frequência de corte (fc)</text>
  <text x="850" y="189" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">1,2 Hz</text>

  <line x1="600" y1="199" x2="910" y2="199" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="216" text-anchor="middle" font-size="9.5" fill="#374151">Taxa de amostragem (fs)</text>
  <text x="850" y="216" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">≈ 4,4 Hz</text>

  <line x1="600" y1="226" x2="910" y2="226" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="243" text-anchor="middle" font-size="9.5" fill="#374151">Atraso de grupo</text>
  <text x="850" y="243" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">&lt; 120 ms</text>

  <line x1="600" y1="253" x2="910" y2="253" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="670" y="270" text-anchor="middle" font-size="9.5" fill="#374151">Memória por amostra</text>
  <text x="850" y="270" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111111">O(1)</text>
  <line x1="600" y1="285" x2="910" y2="285" stroke="#9CA3AF" stroke-width="1"/>

  <!-- Coefficient formulas -->
  <rect x="600" y="300" width="310" height="110" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
  <text x="755" y="322" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Cálculo dos Coeficientes (Bilinear)</text>
  <text x="755" y="345" text-anchor="middle" font-size="9.5" fill="#111111" font-style="italic">
    ω₀ = 2π·fc / fs
  </text>
  <text x="755" y="367" text-anchor="middle" font-size="9.5" fill="#111111" font-style="italic">
    α = sin(ω₀) / (2·√2)
  </text>
  <text x="755" y="390" text-anchor="middle" font-size="9.5" fill="#111111" font-style="italic">
    fc = min(1,2 Hz;  0,40 · fs)
  </text>
</svg>
