<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;filtro_iir_biquad_diagrama&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">
    Filtro Causal IIR Biquad — Forma Direta II Transposta (Butterworth 2ª Ordem)
  </text>

  <!-- ===== LEFT: Block Diagram ===== -->
  <rect x="20" y="45" width="520" height="360" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">
    (a) Diagrama de Blocos — DF-II Transposta
  </text>

  <!-- Input -->
  <text x="50" y="195" font-size="12" font-weight="bold" fill="#2563EB">x[n]</text>
  <line x1="75" y1="190" x2="115" y2="190" stroke="#2563EB" stroke-width="2" marker-end="url(#ar-blue)"/>

  <!-- b0 multiplier -->
  <rect x="115" y="175" width="50" height="30" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="140" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">b₀</text>
  <line x1="165" y1="190" x2="205" y2="190" stroke="#333" stroke-width="1.5"/>

  <!-- Summing junction 1 -->
  <circle cx="220" cy="190" r="15" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="220" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#16A34A">Σ</text>

  <!-- Output -->
  <line x1="235" y1="190" x2="310" y2="190" stroke="#16A34A" stroke-width="2" marker-end="url(#ar)"/>
  <text x="325" y="195" font-size="12" font-weight="bold" fill="#16A34A">y[n]</text>

  <!-- State w1 (delay z^-1 #1) -->
  <rect x="195" y="240" width="50" height="30" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="220" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#4338CA">z⁻¹</text>
  <line x1="220" y1="205" x2="220" y2="240" stroke="#6366F1" stroke-width="1.5"/>
  <text x="240" y="232" font-size="9" fill="#6366F1">w₁</text>

  <!-- b1 path (from x[n] fork down to w1 sum) -->
  <line x1="140" y1="205" x2="140" y2="260" stroke="#333" stroke-width="1"/>
  <rect x="85" y="247" width="40" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="105" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">b₁</text>
  <line x1="125" y1="260" x2="145" y2="260" stroke="#333" stroke-width="1"/>

  <!-- -a1 path (from y[n] fork down to w1 sum) -->
  <line x1="295" y1="205" x2="295" y2="260" stroke="#333" stroke-width="1"/>
  <rect x="255" y="247" width="50" height="26" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="280" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">−a₁</text>
  <line x1="255" y1="260" x2="245" y2="260" stroke="#333" stroke-width="1"/>

  <!-- Summing junction w1 -->
  <circle cx="172" cy="260" r="10" fill="#F9FAFB" stroke="#333" stroke-width="1.5"/>
  <text x="172" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">+</text>

  <!-- State w2 (delay z^-1 #2) -->
  <rect x="195" y="310" width="50" height="30" rx="4" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="220" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#4338CA">z⁻¹</text>
  <line x1="220" y1="270" x2="220" y2="310" stroke="#6366F1" stroke-width="1.5"/>
  <text x="240" y="302" font-size="9" fill="#6366F1">w₂</text>

  <!-- b2 path -->
  <line x1="140" y1="260" x2="140" y2="330" stroke="#333" stroke-width="1"/>
  <rect x="85" y="317" width="40" height="26" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="105" y="334" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">b₂</text>
  <line x1="125" y1="330" x2="145" y2="330" stroke="#333" stroke-width="1"/>

  <!-- -a2 path -->
  <line x1="295" y1="260" x2="295" y2="330" stroke="#333" stroke-width="1"/>
  <rect x="255" y="317" width="50" height="26" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="280" y="334" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">−a₂</text>
  <line x1="255" y1="330" x2="245" y2="330" stroke="#333" stroke-width="1"/>

  <!-- Summing junction w2 -->
  <circle cx="172" cy="330" r="10" fill="#F9FAFB" stroke="#333" stroke-width="1.5"/>
  <text x="172" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">+</text>

  <!-- Equation -->
  <text x="280" y="385" text-anchor="middle" font-size="10" fill="#334155" font-style="italic">
    y[n] = b₀·x[n] + b₁·x[n−1] + b₂·x[n−2] − a₁·y[n−1] − a₂·y[n−2]
  </text>

  <!-- ===== RIGHT: Specifications ===== -->
  <rect x="560" y="45" width="340" height="360" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="730" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">
    (b) Especificações do Filtro
  </text>

  <!-- Parameter table -->
  <rect x="580" y="85" width="300" height="28" rx="0" fill="#E2E8F0"/>
  <text x="660" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">Parâmetro</text>
  <text x="830" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">Valor</text>
  <line x1="750" y1="85" x2="750" y2="280" stroke="#CBD5E1" stroke-width="1"/>

  <line x1="580" y1="113" x2="880" y2="113" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="130" text-anchor="middle" font-size="10" fill="#475569">Tipo</text>
  <text x="830" y="130" text-anchor="middle" font-size="10" fill="#475569">Butterworth (maximally flat)</text>

  <line x1="580" y1="140" x2="880" y2="140" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="157" text-anchor="middle" font-size="10" fill="#475569">Ordem</text>
  <text x="830" y="157" text-anchor="middle" font-size="10" fill="#475569">2ª (1 seção biquadrática)</text>

  <line x1="580" y1="167" x2="880" y2="167" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="184" text-anchor="middle" font-size="10" fill="#475569">Frequência de corte (fc)</text>
  <text x="830" y="184" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">1,2 Hz</text>

  <line x1="580" y1="194" x2="880" y2="194" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="211" text-anchor="middle" font-size="10" fill="#475569">Frequência de amostragem (fs)</text>
  <text x="830" y="211" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">≈ 4,4 Hz</text>

  <line x1="580" y1="221" x2="880" y2="221" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="238" text-anchor="middle" font-size="10" fill="#475569">Atraso de grupo</text>
  <text x="830" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">&lt; 120 ms</text>

  <line x1="580" y1="248" x2="880" y2="248" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="660" y="265" text-anchor="middle" font-size="10" fill="#475569">Memória por amostra</text>
  <text x="830" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">O(1)</text>
  <line x1="580" y1="280" x2="880" y2="280" stroke="#CBD5E1" stroke-width="0.5"/>

  <!-- Coefficient formulas -->
  <rect x="580" y="295" width="300" height="95" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="730" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">Cálculo dos Coeficientes</text>
  <text x="730" y="338" text-anchor="middle" font-size="10" fill="#334155" font-style="italic">
    ω₀ = 2π·fc / fs
  </text>
  <text x="730" y="358" text-anchor="middle" font-size="10" fill="#334155" font-style="italic">
    α = sin(ω₀) / (2·√2)
  </text>
  <text x="730" y="378" text-anchor="middle" font-size="10" fill="#334155" font-style="italic">
    fc = min(1,2 Hz;  0,40 · fs)
  </text>
</svg>
