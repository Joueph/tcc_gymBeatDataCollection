<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;fluxo_watch_iphone_estados&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366F1"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">
    Fluxo de Comunicação Watch ↔ iPhone e Estados do Treino
  </text>

  <!-- ===== LEFT: iPhone (Sender) ===== -->
  <rect x="30" y="45" width="190" height="500" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="125" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">iPhone</text>
  <text x="125" y="83" text-anchor="middle" font-size="9" fill="#059669">React Native / Expo</text>

  <!-- iPhone actions -->
  <rect x="50" y="100" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="119" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">appHeartbeat</text>

  <rect x="50" y="150" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="169" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">startSession</text>

  <rect x="50" y="210" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="229" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">startSet</text>

  <rect x="50" y="280" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="299" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">stopSet</text>

  <rect x="50" y="340" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="359" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">pauseSession</text>

  <rect x="50" y="390" width="150" height="30" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="125" y="409" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">resumeSession</text>

  <rect x="50" y="450" width="150" height="30" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="125" y="469" text-anchor="middle" font-size="9" font-weight="600" fill="#991B1B">stopSession</text>

  <!-- ===== CENTER: Message arrows ===== -->
  <!-- Heartbeat -->
  <line x1="200" y1="115" x2="390" y2="115" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="295" y="108" text-anchor="middle" font-size="8" fill="#059669" font-style="italic">WCSession.sendMessage</text>

  <!-- startSession -->
  <line x1="200" y1="165" x2="390" y2="165" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="295" y="158" text-anchor="middle" font-size="8" fill="#059669">{sessionId, exerciseId, setId}</text>

  <!-- startSet -->
  <line x1="200" y1="225" x2="390" y2="225" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="295" y="218" text-anchor="middle" font-size="8" fill="#059669">{setId, setIndex}</text>

  <!-- MetricSample stream (back) -->
  <line x1="390" y1="255" x2="200" y2="255" stroke="#6366F1" stroke-width="1.5" marker-end="url(#aw)" stroke-dasharray="5,3"/>
  <text x="295" y="268" text-anchor="middle" font-size="8" fill="#6366F1" font-weight="600">⟵ MetricSample (streaming a 25Hz)</text>

  <!-- stopSet -->
  <line x1="200" y1="295" x2="390" y2="295" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- pause -->
  <line x1="200" y1="355" x2="390" y2="355" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- resume -->
  <line x1="200" y1="405" x2="390" y2="405" stroke="#10B981" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- stop -->
  <line x1="200" y1="465" x2="390" y2="465" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- State change (back) -->
  <line x1="390" y1="500" x2="200" y2="500" stroke="#6366F1" stroke-width="1.5" marker-end="url(#aw)" stroke-dasharray="5,3"/>
  <text x="295" y="515" text-anchor="middle" font-size="8" fill="#6366F1" font-weight="600">⟵ stateChanged {state, sessionId}</text>

  <!-- ===== RIGHT: Watch (Receiver + State Machine) ===== -->
  <rect x="390" y="45" width="510" height="500" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="645" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338CA">Apple Watch</text>
  <text x="645" y="83" text-anchor="middle" font-size="9" fill="#6366F1">Swift / watchOS (WatchSessionManager)</text>

  <!-- State machine -->
  <text x="645" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">
    Máquina de Estados do Treino
  </text>

  <!-- State: waiting -->
  <rect x="550" y="120" width="130" height="40" rx="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="615" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">waiting</text>
  <text x="700" y="142" font-size="8" fill="#92400E" font-style="italic">⏳ Inicie uma série</text>

  <!-- Arrow waiting → collecting -->
  <line x1="615" y1="160" x2="615" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="650" y="180" font-size="7" fill="#333">startSession</text>

  <!-- State: collecting -->
  <rect x="550" y="195" width="130" height="40" rx="20" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="615" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">collecting</text>
  <text x="700" y="217" font-size="8" fill="#065F46" font-style="italic">❤️ Coletando dados</text>

  <!-- Arrow collecting → paused -->
  <line x1="615" y1="235" x2="615" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="655" y="260" font-size="7" fill="#333">stopSet / pauseSession</text>

  <!-- State: paused -->
  <rect x="550" y="285" width="130" height="40" rx="20" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="615" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">paused</text>
  <text x="700" y="307" font-size="8" fill="#1E40AF" font-style="italic">⏸ Série pausada</text>

  <!-- Arrow paused → collecting (resume) -->
  <path d="M 680,300 C 720,300 740,260 740,225 C 740,210 720,200 685,200"
        fill="none" stroke="#10B981" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="760" y="260" font-size="7" fill="#10B981">startSet / resumeSession</text>

  <!-- Arrow paused → waiting (stop) -->
  <line x1="615" y1="325" x2="615" y2="370" stroke="#DC2626" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="655" y="350" font-size="7" fill="#DC2626">stopSession</text>

  <!-- State: waiting again (end) -->
  <rect x="550" y="375" width="130" height="40" rx="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="615" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">waiting</text>
  <text x="700" y="397" font-size="8" fill="#92400E" font-style="italic">⏳ Fim do treino</text>

  <!-- State: disconnected -->
  <rect x="430" y="375" width="100" height="40" rx="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="480" y="400" text-anchor="middle" font-size="9" font-weight="bold" fill="#991B1B">disconnected</text>
  <text x="480" y="430" text-anchor="middle" font-size="7" fill="#DC2626">📱 Sem conexão</text>

  <!-- Data flow annotation -->
  <rect x="420" y="455" width="460" height="55" rx="6" fill="#F0F9FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="650" y="475" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E40AF">Fluxo de Dados durante collecting:</text>
  <text x="650" y="492" text-anchor="middle" font-size="8" fill="#334155">
    CoreMotion (25Hz) → MetricSample → WCSession.sendMessage → iPhone
  </text>
  <text x="650" y="504" text-anchor="middle" font-size="8" fill="#334155">
    iPhone → StreamingRepetitionCounter → Vibration.vibrate(45) → UI (52px)
  </text>
</svg>
