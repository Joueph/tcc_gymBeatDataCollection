<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"fluxo_watch_iphone_estados\"></diagram></mxfile>" -->

  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    Fluxo de Comunicação Watch ↔ iPhone e Estados do Treino
  </text>

  <!-- ===== LEFT: iPhone (Sender) ===== -->
  <rect x="35" y="48" width="195" height="505" rx="8" fill="#F9FAFB" stroke="#111111" stroke-width="1.8"/>
  <text x="132" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">iPhone</text>
  <text x="132" y="85" text-anchor="middle" font-size="9" fill="#4B5563">React Native / Expo</text>

  <!-- iPhone actions -->
  <rect x="52" y="102" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="121" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">appHeartbeat</text>

  <rect x="52" y="152" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="171" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">startSession</text>

  <rect x="52" y="212" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="231" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">startSet</text>

  <rect x="52" y="282" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="301" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">stopSet</text>

  <rect x="52" y="342" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="361" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">pauseSession</text>

  <rect x="52" y="392" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="132" y="411" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">resumeSession</text>

  <rect x="52" y="452" width="160" height="30" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.2"/>
  <text x="132" y="471" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">stopSession</text>

  <!-- ===== CENTER: Message arrows ===== -->
  <line x1="212" y1="117" x2="395" y2="117" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <text x="303" y="110" text-anchor="middle" font-size="8" fill="#4B5563" font-style="italic">WCSession.sendMessage</text>

  <line x1="212" y1="167" x2="395" y2="167" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <text x="303" y="160" text-anchor="middle" font-size="8" fill="#4B5563">{sessionId, exerciseId, setId}</text>

  <line x1="212" y1="227" x2="395" y2="227" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <text x="303" y="220" text-anchor="middle" font-size="8" fill="#4B5563">{setId, setIndex}</text>

  <line x1="395" y1="257" x2="212" y2="257" stroke="#111111" stroke-width="1.5" marker-end="url(#aw)" stroke-dasharray="5,3"/>
  <text x="303" y="270" text-anchor="middle" font-size="8" fill="#111111" font-weight="bold">⟵ MetricSample (streaming 25Hz)</text>

  <line x1="212" y1="297" x2="395" y2="297" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <line x1="212" y1="357" x2="395" y2="357" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <line x1="212" y1="407" x2="395" y2="407" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <line x1="212" y1="467" x2="395" y2="467" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>

  <line x1="395" y1="505" x2="212" y2="505" stroke="#111111" stroke-width="1.5" marker-end="url(#aw)" stroke-dasharray="5,3"/>
  <text x="303" y="520" text-anchor="middle" font-size="8" fill="#111111" font-weight="bold">⟵ stateChanged {state, sessionId}</text>

  <!-- ===== RIGHT: Watch ===== -->
  <rect x="395" y="48" width="510" height="505" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="650" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Apple Watch</text>
  <text x="650" y="85" text-anchor="middle" font-size="9" fill="#4B5563">Swift / watchOS (WatchSessionManager)</text>

  <text x="650" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#111111">
    Máquina de Estados do Treino
  </text>

  <!-- State: waiting -->
  <rect x="555" y="122" width="130" height="38" rx="19" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="620" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">waiting</text>
  <text x="705" y="144" font-size="8" fill="#4B5563" font-style="italic">Aguardando início</text>

  <!-- Arrow waiting → collecting -->
  <line x1="620" y1="160" x2="620" y2="192" stroke="#111111" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="655" y="180" font-size="7.5" fill="#4B5563">startSession</text>

  <!-- State: collecting -->
  <rect x="555" y="195" width="130" height="38" rx="19" fill="#FFFFFF" stroke="#111111" stroke-width="2.2"/>
  <text x="620" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">collecting</text>
  <text x="705" y="217" font-size="8" fill="#111111" font-weight="bold">Coletando IMU 6D</text>

  <!-- Arrow collecting → paused -->
  <line x1="620" y1="233" x2="620" y2="282" stroke="#111111" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="660" y="260" font-size="7.5" fill="#4B5563">stopSet / pauseSession</text>

  <!-- State: paused -->
  <rect x="555" y="285" width="130" height="38" rx="19" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="620" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">paused</text>
  <text x="705" y="307" font-size="8" fill="#4B5563" font-style="italic">Série pausada</text>

  <!-- Arrow paused → collecting (resume) -->
  <path d="M 685,298 C 730,298 745,260 745,225 C 745,210 725,200 690,200"
        fill="none" stroke="#111111" stroke-width="1.2" marker-end="url(#aw)"/>
  <text x="765" y="260" font-size="7" fill="#111111">resumeSession</text>

  <!-- Arrow paused → waiting (stop) -->
  <line x1="620" y1="323" x2="620" y2="372" stroke="#111111" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="655" y="350" font-size="7.5" fill="#4B5563">stopSession</text>

  <!-- State: waiting again -->
  <rect x="555" y="375" width="130" height="38" rx="19" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="620" y="399" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">waiting</text>
  <text x="705" y="397" font-size="8" fill="#4B5563" font-style="italic">Fim do treino</text>

  <!-- State: disconnected -->
  <rect x="430" y="375" width="105" height="38" rx="19" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="482" y="398" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#111111">disconnected</text>
  <text x="482" y="426" text-anchor="middle" font-size="7.5" fill="#4B5563">Sem conexão</text>

  <!-- Data flow annotation -->
  <rect x="420" y="458" width="460" height="52" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="650" y="476" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Fluxo Contínuo durante collecting:</text>
  <text x="650" y="492" text-anchor="middle" font-size="8" fill="#374151">
    CoreMotion (25Hz) → MetricSample → WCSession.sendMessage → iPhone
  </text>
  <text x="650" y="504" text-anchor="middle" font-size="8" fill="#374151">
    iPhone → StreamingRepetitionCounter → Vibration.vibrate(45ms) → UI (52px)
  </text>
</svg>
