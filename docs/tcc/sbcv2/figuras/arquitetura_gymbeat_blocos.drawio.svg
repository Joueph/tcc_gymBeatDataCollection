<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" width="820" height="720"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"arquitetura_gymbeat_blocos\"></diagram></mxfile>" -->

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    Arquitetura Distribuída GymBeat — Diagrama em Blocos
  </text>

  <!-- ===== LAYER 1: APPLE WATCH ===== -->
  <rect x="40" y="52" width="740" height="170" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.8"/>
  <text x="410" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">
    CAMADA 1 — NÓ COLETOR (Apple Watch · watchOS · Swift)
  </text>

  <!-- Watch blocks -->
  <rect x="65" y="92" width="155" height="58" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="142" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">CoreMotion</text>
  <text x="142" y="130" text-anchor="middle" font-size="9" fill="#374151">IMU a 25 Hz</text>
  <text x="142" y="142" text-anchor="middle" font-size="8" fill="#4B5563">userAcc + rotationRate</text>

  <rect x="240" y="92" width="155" height="58" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="317" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">HealthKit</text>
  <text x="317" y="130" text-anchor="middle" font-size="9" fill="#374151">HKWorkoutSession</text>
  <text x="317" y="142" text-anchor="middle" font-size="8" fill="#4B5563">FC · kcal · SpO₂ · Passos</text>

  <rect x="415" y="92" width="155" height="58" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="492" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">MetricSample</text>
  <text x="492" y="130" text-anchor="middle" font-size="9" fill="#374151">11 canais / quadro</text>
  <text x="492" y="142" text-anchor="middle" font-size="8" fill="#4B5563">Acc(3) + Gyro(3) + Saúde(5)</text>

  <rect x="590" y="92" width="165" height="58" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="672" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">WCSession</text>
  <text x="672" y="130" text-anchor="middle" font-size="9" fill="#374151">WatchConnectivity</text>
  <text x="672" y="142" text-anchor="middle" font-size="8" fill="#4B5563">sendMessage / transferUserInfo</text>

  <!-- Arrows between watch blocks -->
  <line x1="220" y1="121" x2="238" y2="121" stroke="#111111" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="395" y1="121" x2="413" y2="121" stroke="#111111" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="570" y1="121" x2="588" y2="121" stroke="#111111" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Connection Watch → Phone -->
  <rect x="355" y="228" width="110" height="28" rx="14" fill="#111111" stroke="#000000" stroke-width="1"/>
  <text x="410" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FFFFFF">Bluetooth</text>
  <line x1="410" y1="222" x2="410" y2="228" stroke="#111111" stroke-width="2"/>
  <line x1="410" y1="256" x2="410" y2="276" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <text x="475" y="246" font-size="8.5" fill="#4B5563" font-style="italic">Streaming contínuo ~4,4 Hz</text>

  <!-- ===== LAYER 2: IPHONE ===== -->
  <rect x="40" y="278" width="740" height="210" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2.2"/>
  <text x="410" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">
    CAMADA 2 — NÓ DE PROCESSAMENTO (iPhone · React Native / Expo · Hermes)
  </text>

  <!-- Phone blocks - Row 1 -->
  <rect x="65" y="318" width="145" height="52" rx="6" fill="#F9FAFB" stroke="#111111" stroke-width="1.5"/>
  <text x="137" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Expo Modules</text>
  <text x="137" y="354" text-anchor="middle" font-size="8" fill="#374151">WatchConnectivity</text>
  <text x="137" y="364" text-anchor="middle" font-size="8" fill="#374151">HealthKit (Swift)</text>

  <rect x="230" y="318" width="145" height="52" rx="6" fill="#F9FAFB" stroke="#111111" stroke-width="1.5"/>
  <text x="302" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Buffer Circular</text>
  <text x="302" y="354" text-anchor="middle" font-size="8" fill="#374151">W = 35 amostras</text>
  <text x="302" y="364" text-anchor="middle" font-size="8" fill="#374151">Inserção O(1)</text>

  <rect x="395" y="318" width="150" height="52" rx="6" fill="#F9FAFB" stroke="#111111" stroke-width="1.5"/>
  <text x="470" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Moving PCA</text>
  <text x="470" y="354" text-anchor="middle" font-size="8" fill="#374151">Power Iteration (25 iter)</text>
  <text x="470" y="364" text-anchor="middle" font-size="8" fill="#374151">+ Skewness Alignment</text>

  <rect x="565" y="318" width="190" height="52" rx="6" fill="#F9FAFB" stroke="#111111" stroke-width="1.5"/>
  <text x="660" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">IIR Biquad + FSM</text>
  <text x="660" y="354" text-anchor="middle" font-size="8" fill="#374151">Butterworth 2ª ordem (fc=1,2 Hz)</text>
  <text x="660" y="364" text-anchor="middle" font-size="8" fill="#374151">Detecção + Janela Refratária 1,6 s</text>

  <!-- Phone blocks - Row 2 -->
  <rect x="65" y="386" width="145" height="48" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.2"/>
  <text x="137" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">SQLite</text>
  <text x="137" y="422" text-anchor="middle" font-size="8" fill="#374151">expo-sqlite (WAL)</text>

  <rect x="230" y="386" width="145" height="48" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.2"/>
  <text x="302" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Expo Router v6</text>
  <text x="302" y="422" text-anchor="middle" font-size="8" fill="#374151">Telas .tsx (file-based)</text>

  <rect x="395" y="386" width="150" height="48" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.2"/>
  <text x="470" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Vibração Háptica</text>
  <text x="470" y="422" text-anchor="middle" font-size="8" fill="#374151">Vibration.vibrate(45 ms)</text>

  <rect x="565" y="386" width="190" height="48" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.2"/>
  <text x="660" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Motor Streaming (TS)</text>
  <text x="660" y="422" text-anchor="middle" font-size="8" fill="#374151">StreamingRepetitionCounter</text>

  <!-- Arrows Row 1 -->
  <line x1="210" y1="344" x2="228" y2="344" stroke="#111111" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="375" y1="344" x2="393" y2="344" stroke="#111111" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="545" y1="344" x2="563" y2="344" stroke="#111111" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- Connection Phone → Cloud -->
  <rect x="355" y="496" width="110" height="28" rx="14" fill="#374151" stroke="#111111" stroke-width="1"/>
  <text x="410" y="514" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FFFFFF">HTTPS</text>
  <line x1="410" y1="488" x2="410" y2="496" stroke="#111111" stroke-width="2"/>
  <line x1="410" y1="524" x2="410" y2="544" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <text x="475" y="514" font-size="8.5" fill="#4B5563" font-style="italic">Sincronização assíncrona em lote</text>

  <!-- ===== LAYER 3: FIREBASE ===== -->
  <rect x="40" y="546" width="740" height="135" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="410" y="568" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">
    CAMADA 3 — NÓ EM NUVEM (Firebase · Google Cloud)
  </text>

  <!-- Cloud blocks -->
  <rect x="65" y="586" width="215" height="52" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="172" y="606" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Firebase Authentication</text>
  <text x="172" y="622" text-anchor="middle" font-size="8.5" fill="#4B5563">E-mail / senha + AsyncStorage</text>

  <rect x="300" y="586" width="220" height="52" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="410" y="606" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Cloud Firestore</text>
  <text x="410" y="622" text-anchor="middle" font-size="8.5" fill="#4B5563">users/{uid}/exerciseSessions</text>

  <rect x="540" y="586" width="215" height="52" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="647" y="606" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Repositório de Pesquisa</text>
  <text x="647" y="622" text-anchor="middle" font-size="8.5" fill="#4B5563">writeBatch (chunks de 20 docs)</text>

  <!-- Legend -->
  <rect x="65" y="690" width="690" height="22" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="0.8"/>
  <circle cx="120" cy="701" r="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
  <text x="130" y="705" font-size="8.5" fill="#111111">Watch (Swift)</text>
  <circle cx="270" cy="701" r="4" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="280" y="705" font-size="8.5" font-weight="bold" fill="#111111">iPhone (TypeScript / Hermes)</text>
  <circle cx="490" cy="701" r="4" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="705" font-size="8.5" fill="#111111">Nuvem (Firebase)</text>
  <text x="650" y="705" font-size="8.5" fill="#4B5563">Latência: &lt; 340 ms</text>
</svg>
