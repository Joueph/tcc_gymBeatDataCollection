<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" width="780" height="680"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;arquitetura_gymbeat_blocos&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366F1"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#C7D2FE;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#A7F3D0;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">
    Arquitetura Distribuída GymBeat — Diagrama em Blocos
  </text>

  <!-- ===== LAYER 1: APPLE WATCH ===== -->
  <rect x="40" y="50" width="700" height="165" rx="12" fill="url(#watchGrad)" stroke="#6366F1" stroke-width="2"/>
  <text x="390" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338CA">
    CAMADA 1 — NÓ COLETOR (Apple Watch · watchOS · Swift)
  </text>

  <!-- Watch blocks -->
  <rect x="70" y="90" width="145" height="55" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="142" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338CA">CoreMotion</text>
  <text x="142" y="128" text-anchor="middle" font-size="9" fill="#6366F1">IMU a 25 Hz</text>
  <text x="142" y="140" text-anchor="middle" font-size="8" fill="#818CF8">userAcceleration + rotationRate</text>

  <rect x="235" y="90" width="145" height="55" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="307" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338CA">HealthKit</text>
  <text x="307" y="128" text-anchor="middle" font-size="9" fill="#6366F1">HKWorkoutSession</text>
  <text x="307" y="140" text-anchor="middle" font-size="8" fill="#818CF8">FC · kcal · SpO₂ · Passos</text>

  <rect x="400" y="90" width="145" height="55" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="472" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338CA">MetricSample</text>
  <text x="472" y="128" text-anchor="middle" font-size="9" fill="#6366F1">11 canais / quadro</text>
  <text x="472" y="140" text-anchor="middle" font-size="8" fill="#818CF8">Acc(3) + Gyro(3) + Saúde(5)</text>

  <rect x="565" y="90" width="155" height="55" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="642" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338CA">WCSession</text>
  <text x="642" y="128" text-anchor="middle" font-size="9" fill="#6366F1">WatchConnectivity</text>
  <text x="642" y="140" text-anchor="middle" font-size="8" fill="#818CF8">sendMessage · transferUserInfo</text>

  <!-- Arrows between watch blocks -->
  <line x1="215" y1="117" x2="233" y2="117" stroke="#6366F1" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="380" y1="117" x2="398" y2="117" stroke="#6366F1" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="545" y1="117" x2="563" y2="117" stroke="#6366F1" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Connection Watch → Phone -->
  <rect x="340" y="218" width="100" height="30" rx="15" fill="#6366F1" stroke="#4338CA" stroke-width="1.5"/>
  <text x="390" y="237" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Bluetooth</text>
  <line x1="390" y1="215" x2="390" y2="218" stroke="#6366F1" stroke-width="2"/>
  <line x1="390" y1="248" x2="390" y2="265" stroke="#6366F1" stroke-width="2" marker-end="url(#a1)"/>
  <text x="450" y="240" font-size="8" fill="#6366F1" font-style="italic">Streaming sem bloqueio</text>

  <!-- ===== LAYER 2: IPHONE ===== -->
  <rect x="40" y="265" width="700" height="205" rx="12" fill="url(#phoneGrad)" stroke="#10B981" stroke-width="2"/>
  <text x="390" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">
    CAMADA 2 — NÓ DE PROCESSAMENTO (iPhone · React Native / Expo · Hermes)
  </text>

  <!-- Phone blocks - Row 1 -->
  <rect x="70" y="305" width="130" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="135" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Expo Modules</text>
  <text x="135" y="342" text-anchor="middle" font-size="8" fill="#059669">WatchConnectivity</text>
  <text x="135" y="352" text-anchor="middle" font-size="8" fill="#059669">HealthKit (Swift)</text>

  <rect x="220" y="305" width="130" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="285" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Buffer Circular</text>
  <text x="285" y="342" text-anchor="middle" font-size="8" fill="#059669">W = 35 amostras</text>
  <text x="285" y="352" text-anchor="middle" font-size="8" fill="#059669">Inserção O(1)</text>

  <rect x="370" y="305" width="130" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="435" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Moving PCA</text>
  <text x="435" y="342" text-anchor="middle" font-size="8" fill="#059669">Power Iteration (25 iter)</text>
  <text x="435" y="352" text-anchor="middle" font-size="8" fill="#059669">+ Skewness Alignment</text>

  <rect x="520" y="305" width="200" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="620" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">IIR Biquad + FSM</text>
  <text x="620" y="342" text-anchor="middle" font-size="8" fill="#059669">Butterworth 2ª ordem (fc=1.2Hz)</text>
  <text x="620" y="352" text-anchor="middle" font-size="8" fill="#059669">Detecção + Janela Refratária 1.6s</text>

  <!-- Phone blocks - Row 2 -->
  <rect x="70" y="370" width="130" height="45" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="135" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">SQLite</text>
  <text x="135" y="405" text-anchor="middle" font-size="8" fill="#059669">expo-sqlite (WAL)</text>

  <rect x="220" y="370" width="130" height="45" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="285" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Expo Router v6</text>
  <text x="285" y="405" text-anchor="middle" font-size="8" fill="#059669">Telas .tsx (file-based)</text>

  <rect x="370" y="370" width="130" height="45" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="435" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Vibração Háptica</text>
  <text x="435" y="405" text-anchor="middle" font-size="8" fill="#059669">Vibration.vibrate(45)</text>

  <rect x="520" y="370" width="200" height="45" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="620" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">Motor Streaming (TSX)</text>
  <text x="620" y="405" text-anchor="middle" font-size="8" fill="#059669">StreamingRepetitionCounter</text>

  <!-- Arrows Row 1 -->
  <line x1="200" y1="330" x2="218" y2="330" stroke="#10B981" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="350" y1="330" x2="368" y2="330" stroke="#10B981" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="500" y1="330" x2="518" y2="330" stroke="#10B981" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- Connection Phone → Cloud -->
  <rect x="340" y="475" width="100" height="30" rx="15" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <text x="390" y="494" text-anchor="middle" font-size="9" font-weight="bold" fill="white">HTTPS</text>
  <line x1="390" y1="470" x2="390" y2="475" stroke="#F59E0B" stroke-width="2"/>
  <line x1="390" y1="505" x2="390" y2="525" stroke="#F59E0B" stroke-width="2" marker-end="url(#a2)"/>
  <text x="450" y="497" font-size="8" fill="#92400E" font-style="italic">Sincronização assíncrona em lote</text>

  <!-- ===== LAYER 3: FIREBASE ===== -->
  <rect x="40" y="525" width="700" height="135" rx="12" fill="url(#cloudGrad)" stroke="#F59E0B" stroke-width="2"/>
  <text x="390" y="548" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">
    CAMADA 3 — NÓ EM NUVEM (Firebase · Google Cloud)
  </text>

  <!-- Cloud blocks -->
  <rect x="70" y="565" width="195" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="167" y="585" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">Firebase Authentication</text>
  <text x="167" y="602" text-anchor="middle" font-size="8" fill="#B45309">E-mail / senha + AsyncStorage</text>

  <rect x="290" y="565" width="195" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="387" y="585" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">Cloud Firestore</text>
  <text x="387" y="602" text-anchor="middle" font-size="8" fill="#B45309">users/{uid}/exerciseSessions</text>

  <rect x="510" y="565" width="210" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="615" y="585" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">Repositório de Pesquisa</text>
  <text x="615" y="602" text-anchor="middle" font-size="8" fill="#B45309">writeBatch (chunks de 20 docs)</text>

  <!-- Legend -->
  <rect x="70" y="635" width="650" height="20" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
  <circle cx="140" cy="645" r="4" fill="#6366F1"/>
  <text x="150" y="649" font-size="8" fill="#333">Watch (Swift)</text>
  <circle cx="260" cy="645" r="4" fill="#10B981"/>
  <text x="270" y="649" font-size="8" fill="#333">iPhone (TypeScript/React Native)</text>
  <circle cx="440" cy="645" r="4" fill="#F59E0B"/>
  <text x="450" y="649" font-size="8" fill="#333">Nuvem (Firebase)</text>
  <text x="600" y="649" font-size="8" fill="#999">Latência total: &lt; 340 ms</text>
</svg>
