<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 920 520" width="920" height="520"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;ciclo_biomecanico_repeticao&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">
    Ciclo Biomecânico de uma Repetição e Correspondência no Sinal Inercial
  </text>

  <!-- ===== TOP SECTION: Biomechanical Phases ===== -->
  <text x="460" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#444">
    (a) Fases Biomecânicas do Movimento
  </text>

  <!-- Phase boxes -->
  <!-- Eccentric -->
  <rect x="60" y="80" width="220" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="170" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Fase Excêntrica</text>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#78350F">Alongamento muscular</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#78350F">sob tensão (descida)</text>
  <text x="170" y="160" text-anchor="middle" font-size="10" fill="#92400E" font-style="italic">v(t) &lt; 0</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="125" x2="330" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Inflection -->
  <rect x="330" y="80" width="220" height="90" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="440" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">Ponto de Inflexão</text>
  <text x="440" y="125" text-anchor="middle" font-size="11" fill="#1E40AF">Transição isométrica</text>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#1E40AF">instantânea</text>
  <text x="440" y="160" text-anchor="middle" font-size="10" fill="#1E3A8A" font-style="italic">v(t) = 0</text>

  <!-- Arrow 2 -->
  <line x1="550" y1="125" x2="600" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Concentric -->
  <rect x="600" y="80" width="220" height="90" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="710" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">Fase Concêntrica</text>
  <text x="710" y="125" text-anchor="middle" font-size="11" fill="#047857">Contração motora</text>
  <text x="710" y="142" text-anchor="middle" font-size="11" fill="#047857">(subida explosiva)</text>
  <text x="710" y="160" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">v(t) &gt; 0</text>

  <!-- ===== BOTTOM SECTION: Inertial Signal ===== -->
  <text x="460" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#444">
    (b) Sinal Inercial Projetado 1D — p(t) = a(t) · v₁
  </text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="860" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="80" y1="490" x2="80" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="870" y="385" font-size="11" fill="#333">t (s)</text>
  <text x="60" y="235" font-size="11" fill="#333">p(t)</text>

  <!-- Zero line -->
  <line x1="80" y1="380" x2="840" y2="380" stroke="#999" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="65" y="384" font-size="10" fill="#666" text-anchor="end">0</text>

  <!-- Signal curve - one full repetition cycle -->
  <path d="M 100,380 
           C 130,380 150,380 180,400 
           C 210,420 240,450 280,460 
           C 320,470 340,460 360,430 
           C 380,400 400,380 420,350 
           C 440,320 460,280 490,260 
           C 520,240 540,250 560,280 
           C 580,310 600,350 620,370
           C 640,380 660,380 680,395
           C 700,410 720,440 740,455
           C 760,465 780,455 800,420
           C 810,400 820,385 840,380"
        fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Phase regions with colored backgrounds -->
  <!-- Eccentric region 1 -->
  <rect x="160" y="225" width="200" height="275" rx="0" fill="#FEF3C7" opacity="0.15"/>
  <text x="260" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Excêntrica</text>

  <!-- Inflection point 1 -->
  <circle cx="280" cy="460" r="6" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="280" y1="460" x2="280" y2="490" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="280" y="505" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="600">Inflexão (vale)</text>

  <!-- Concentric region -->
  <rect x="360" y="225" width="200" height="275" rx="0" fill="#D1FAE5" opacity="0.15"/>
  <text x="460" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">Concêntrica</text>

  <!-- Peak point -->
  <circle cx="490" cy="260" r="6" fill="#10B981" stroke="#065F46" stroke-width="2"/>
  <line x1="490" y1="260" x2="490" y2="230" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="490" y="242" text-anchor="middle" font-size="9" fill="#065F46" font-weight="600">Crista (pico) = 1 rep</text>

  <!-- Eccentric region 2 -->
  <rect x="560" y="225" width="200" height="275" rx="0" fill="#FEF3C7" opacity="0.15"/>
  <text x="660" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Excêntrica</text>

  <!-- Inflection point 2 -->
  <circle cx="740" cy="455" r="6" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Connecting dashed lines from top to bottom -->
  <line x1="170" y1="170" x2="170" y2="225" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="440" y1="170" x2="280" y2="456" stroke="#3B82F6" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="710" y1="170" x2="490" y2="260" stroke="#10B981" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Legend -->
  <rect x="620" y="470" width="220" height="40" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="640" cy="483" r="4" fill="#2563EB"/>
  <text x="650" y="487" font-size="10" fill="#333">Sinal projetado p(t)</text>
  <circle cx="640" cy="500" r="4" fill="#10B981"/>
  <text x="650" y="504" font-size="10" fill="#333">Pico validado (repetição)</text>
</svg>
