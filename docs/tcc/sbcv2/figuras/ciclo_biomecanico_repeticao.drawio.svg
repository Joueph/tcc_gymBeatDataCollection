<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 960 550" width="960" height="550"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"ciclo_biomecanico_repeticao\"></diagram></mxfile>" -->

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">
    Ciclo Biomecânico de uma Repetição e Correspondência no Sinal Inercial
  </text>

  <!-- ===== TOP SECTION: Biomechanical Phases ===== -->
  <text x="480" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">
    (a) Fases Biomecânicas do Movimento
  </text>

  <!-- Phase boxes -->
  <!-- Eccentric -->
  <rect x="70" y="82" width="220" height="92" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
  <text x="180" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Fase Excêntrica</text>
  <text x="180" y="127" text-anchor="middle" font-size="11" fill="#374151">Alongamento muscular</text>
  <text x="180" y="144" text-anchor="middle" font-size="11" fill="#374151">sob tensão (descida)</text>
  <text x="180" y="162" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">v(t) &lt; 0</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="128" x2="345" y2="128" stroke="#111111" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Inflection -->
  <rect x="350" y="82" width="220" height="92" rx="6" fill="#F3F4F6" stroke="#111111" stroke-width="1.8"/>
  <text x="460" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Ponto de Inflexão</text>
  <text x="460" y="127" text-anchor="middle" font-size="11" fill="#374151">Transição isométrica</text>
  <text x="460" y="144" text-anchor="middle" font-size="11" fill="#374151">instantânea</text>
  <text x="460" y="162" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">v(t) = 0</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="128" x2="625" y2="128" stroke="#111111" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Concentric -->
  <rect x="630" y="82" width="220" height="92" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.2"/>
  <text x="740" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Fase Concêntrica</text>
  <text x="740" y="127" text-anchor="middle" font-size="11" fill="#374151">Contração motora</text>
  <text x="740" y="144" text-anchor="middle" font-size="11" fill="#374151">(subida explosiva)</text>
  <text x="740" y="162" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">v(t) &gt; 0</text>

  <!-- ===== BOTTOM SECTION: Inertial Signal ===== -->
  <text x="480" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">
    (b) Sinal Inercial Projetado 1D — p(t) = a(t) · v₁
  </text>

  <!-- Axes -->
  <line x1="70" y1="390" x2="880" y2="390" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="70" y1="500" x2="70" y2="235" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="895" y="394" font-size="11" font-weight="bold" fill="#111111">t (s)</text>
  <text x="50" y="240" font-size="11" font-weight="bold" fill="#111111">p(t)</text>

  <!-- Zero line -->
  <line x1="70" y1="390" x2="860" y2="390" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="55" y="394" font-size="10" fill="#4B5563" text-anchor="end">0</text>

  <!-- Phase regions with monochrome shading -->
  <!-- Eccentric region 1 -->
  <rect x="150" y="235" width="200" height="265" fill="#F3F4F6" opacity="0.6"/>
  <text x="250" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#4B5563">Excêntrica</text>

  <!-- Inflection point 1 -->
  <circle cx="270" cy="460" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <line x1="270" y1="460" x2="270" y2="490" stroke="#4B5563" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="270" y="504" text-anchor="middle" font-size="9" fill="#111111" font-weight="600">Inflexão (vale)</text>

  <!-- Concentric region -->
  <rect x="350" y="235" width="200" height="265" fill="#E5E7EB" opacity="0.4"/>
  <text x="450" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">Concêntrica</text>

  <!-- Peak point -->
  <circle cx="480" cy="270" r="6" fill="#111111" stroke="#000000" stroke-width="2"/>
  <line x1="480" y1="270" x2="480" y2="240" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="252" text-anchor="middle" font-size="9" fill="#111111" font-weight="bold">Crista (pico) = 1 rep</text>

  <!-- Eccentric region 2 -->
  <rect x="550" y="235" width="200" height="265" fill="#F3F4F6" opacity="0.6"/>
  <text x="650" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#4B5563">Excêntrica</text>

  <!-- Inflection point 2 -->
  <circle cx="730" cy="455" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>

  <!-- Signal curve - one full repetition cycle -->
  <path d="M 90,390 
           C 120,390 140,390 170,410 
           C 200,430 230,455 270,460 
           C 310,465 330,455 350,430 
           C 370,405 390,380 410,350 
           C 430,320 450,285 480,270 
           C 510,255 530,265 550,295 
           C 570,325 590,360 610,380
           C 630,390 650,390 670,405
           C 690,420 710,445 730,455
           C 750,465 770,455 790,425
           C 800,405 810,395 830,390"
        fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Connecting dashed lines from top to bottom -->
  <line x1="180" y1="174" x2="180" y2="235" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="460" y1="174" x2="270" y2="456" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="740" y1="174" x2="480" y2="270" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Legend -->
  <rect x="640" y="475" width="230" height="46" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="655" y1="490" x2="675" y2="490" stroke="#111111" stroke-width="2.5"/>
  <text x="685" y="494" font-size="9.5" fill="#111111">Sinal projetado p(t)</text>
  <circle cx="665" cy="508" r="4" fill="#111111"/>
  <text x="685" y="512" font-size="9.5" fill="#111111">Pico validado (repetição)</text>
</svg>
