<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 920 480" width="920" height="480"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="&lt;mxfile&gt;&lt;diagram name=&quot;comparacao_magnitude_vs_pca&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" -->

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">
    Comparação: Magnitude Euclidiana (L₂) vs. Projeção PCA 1D
  </text>

  <!-- ===== LEFT PANEL: L2 Magnitude ===== -->
  <rect x="20" y="45" width="430" height="420" rx="8" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="235" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">
    (a) Magnitude Euclidiana ‖a(t)‖₂
  </text>
  <text x="235" y="84" text-anchor="middle" font-size="10" fill="#991B1B" font-style="italic">
    Estritamente positiva — perde direcionalidade
  </text>

  <!-- L2 Axes -->
  <line x1="60" y1="360" x2="420" y2="360" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="60" y1="400" x2="60" y2="100" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="365" font-size="10" fill="#333">t</text>
  <text x="45" y="105" font-size="10" fill="#333">‖a‖₂</text>
  <text x="50" y="365" font-size="9" fill="#666" text-anchor="end">0</text>

  <!-- L2 signal - always positive, with spurious double peaks -->
  <path d="M 70,340 C 85,335 95,320 110,280 C 125,240 135,210 150,185
           C 165,160 170,155 180,170 C 190,185 195,200 205,230
           C 215,260 220,280 230,310 C 240,335 245,340 255,335
           C 265,325 275,295 285,255 C 295,215 305,180 315,160
           C 325,145 330,140 340,155 C 350,170 355,200 365,250
           C 375,300 380,330 390,340 C 395,342 400,340 405,338"
        fill="none" stroke="#DC2626" stroke-width="2.5"/>

  <!-- Spurious peak markers -->
  <circle cx="150" cy="185" r="5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
  <circle cx="180" cy="170" r="5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
  <circle cx="315" cy="160" r="5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
  <circle cx="340" cy="155" r="5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>

  <!-- Problem annotations -->
  <rect x="100" y="110" width="130" height="38" rx="4" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
  <text x="165" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#991B1B">⚠ Pico duplicado!</text>
  <text x="165" y="142" text-anchor="middle" font-size="9" fill="#991B1B">Excêntrica ≈ Concêntrica</text>
  <line x1="150" y1="148" x2="150" y2="180" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="148" x2="180" y2="165" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="265" y="110" width="130" height="38" rx="4" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
  <text x="330" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#991B1B">⚠ Pico duplicado!</text>
  <text x="330" y="142" text-anchor="middle" font-size="9" fill="#991B1B">Contagem: 4 (errado)</text>
  <line x1="315" y1="148" x2="315" y2="155" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="148" x2="340" y2="150" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Result box -->
  <rect x="80" y="380" width="300" height="35" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="230" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">
    ✗ Detecção: 4 picos → 2 repetições reais
  </text>

  <!-- ===== RIGHT PANEL: PCA 1D ===== -->
  <rect x="470" y="45" width="430" height="420" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="685" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#16A34A">
    (b) Projeção PCA 1D — p(t) = a(t) · v₁
  </text>
  <text x="685" y="84" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">
    Preserva direcionalidade — cristas distintas
  </text>

  <!-- PCA Axes -->
  <line x1="510" y1="280" x2="870" y2="280" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="510" y1="400" x2="510" y2="100" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="880" y="285" font-size="10" fill="#333">t</text>
  <text x="497" y="105" font-size="10" fill="#333">p(t)</text>
  <text x="500" y="285" font-size="9" fill="#666" text-anchor="end">0</text>

  <!-- PCA signal - bipolar, clean peaks -->
  <path d="M 520,280 C 535,285 545,300 555,330 C 565,355 575,370 590,365
           C 605,355 615,330 625,290 C 635,250 645,200 660,165
           C 675,140 685,135 695,150 C 705,165 715,200 725,250
           C 735,290 745,330 755,355 C 765,370 775,365 785,340
           C 795,315 800,290 810,250 C 820,210 830,170 840,145
           C 845,138 850,140 855,160"
        fill="none" stroke="#16A34A" stroke-width="2.5"/>

  <!-- Clean peak markers - only at true concentric crests -->
  <circle cx="660" cy="165" r="6" fill="#16A34A" stroke="#166534" stroke-width="2"/>
  <circle cx="840" cy="145" r="6" fill="#16A34A" stroke="#166534" stroke-width="2"/>

  <!-- Concentric labels -->
  <line x1="660" y1="158" x2="660" y2="118" stroke="#16A34A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="660" y="112" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">Concêntrica ↑</text>

  <line x1="840" y1="138" x2="840" y2="118" stroke="#16A34A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="840" y="112" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">Concêntrica ↑</text>

  <!-- Eccentric valley labels -->
  <circle cx="590" cy="365" r="4" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  <text x="590" y="390" text-anchor="middle" font-size="9" fill="#92400E">Excêntrica ↓</text>
  <circle cx="755" cy="355" r="4" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  <text x="755" y="390" text-anchor="middle" font-size="9" fill="#92400E">Excêntrica ↓</text>

  <!-- Result box -->
  <rect x="530" y="410" width="300" height="35" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="680" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">
    ✓ Detecção: 2 cristas → 2 repetições reais
  </text>

  <!-- Positive/Negative zones for PCA -->
  <text x="865" y="195" font-size="9" fill="#16A34A" font-weight="600">+</text>
  <text x="865" y="340" font-size="9" fill="#F59E0B" font-weight="600">−</text>
</svg>
