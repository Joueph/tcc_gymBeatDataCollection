<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 960 490" width="960" height="490"
     style="background-color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif;">
  <!-- content="<mxfile><diagram name=\"comparacao_magnitude_vs_pca\"></diagram></mxfile>" -->

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    Comparação: Magnitude Euclidiana (L₂) vs. Projeção PCA 1D
  </text>

  <!-- ===== LEFT PANEL: L2 Magnitude ===== -->
  <rect x="30" y="52" width="430" height="415" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="245" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">
    (a) Magnitude Euclidiana ‖a(t)‖₂
  </text>
  <text x="245" y="94" text-anchor="middle" font-size="10" fill="#4B5563" font-style="italic">
    Estritamente positiva — colapso de fases opostas
  </text>

  <!-- L2 Axes -->
  <line x1="65" y1="365" x2="425" y2="365" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="65" y1="400" x2="65" y2="110" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="369" font-size="10" font-weight="bold" fill="#111111">t</text>
  <text x="48" y="115" font-size="10" font-weight="bold" fill="#111111">‖a‖₂</text>
  <text x="55" y="369" font-size="9" fill="#4B5563" text-anchor="end">0</text>

  <!-- L2 signal - always positive, spurious double peaks (dashed) -->
  <path d="M 75,345 C 90,340 100,325 115,285 C 130,245 140,215 155,190
           C 170,165 175,160 185,175 C 195,190 200,205 210,235
           C 220,265 225,285 235,315 C 245,340 250,345 260,340
           C 270,330 280,300 290,260 C 300,220 310,185 320,165
           C 330,150 335,145 345,160 C 355,175 360,205 370,255
           C 380,305 385,335 395,345 C 400,347 405,345 410,343"
        fill="none" stroke="#4B5563" stroke-width="2.2" stroke-dasharray="6,3"/>

  <!-- Spurious peak markers (hollow circles) -->
  <circle cx="155" cy="190" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <circle cx="185" cy="175" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <circle cx="320" cy="165" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <circle cx="345" cy="160" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>

  <!-- Problem annotations -->
  <rect x="105" y="115" width="135" height="38" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="172" y="131" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">[!] Pico duplicado</text>
  <text x="172" y="145" text-anchor="middle" font-size="8.5" fill="#374151">Excêntrica ≈ Concêntrica</text>
  <line x1="155" y1="153" x2="155" y2="185" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="185" y1="153" x2="185" y2="170" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="275" y="115" width="135" height="38" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="342" y="131" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">[!] Pico duplicado</text>
  <text x="342" y="145" text-anchor="middle" font-size="8.5" fill="#374151">Contagem espúria</text>
  <line x1="320" y1="153" x2="320" y2="160" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="345" y1="153" x2="345" y2="155" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Result box -->
  <rect x="80" y="388" width="330" height="34" rx="4" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
  <text x="245" y="409" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">
    [✗] Detecção: 4 picos para 2 repetições reais
  </text>

  <!-- ===== RIGHT PANEL: PCA 1D ===== -->
  <rect x="495" y="52" width="435" height="415" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="712" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">
    (b) Projeção PCA 1D — p(t) = a(t) · v₁
  </text>
  <text x="712" y="94" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">
    Preserva polaridade direcional — cristas distintas
  </text>

  <!-- PCA Axes -->
  <line x1="535" y1="285" x2="895" y2="285" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="535" y1="400" x2="535" y2="110" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="905" y="289" font-size="10" font-weight="bold" fill="#111111">t</text>
  <text x="518" y="115" font-size="10" font-weight="bold" fill="#111111">p(t)</text>
  <text x="525" y="289" font-size="9" fill="#4B5563" text-anchor="end">0</text>

  <!-- PCA signal - bipolar, clean peaks (solid bold) -->
  <path d="M 545,285 C 560,290 570,305 580,335 C 590,360 600,375 615,370
           C 630,360 640,335 650,295 C 660,255 670,205 685,170
           C 700,145 710,140 720,155 C 730,170 740,205 750,255
           C 760,295 770,335 780,360 C 790,375 800,370 810,345
           C 820,320 825,295 835,255 C 845,215 855,175 865,150
           C 870,143 875,145 880,165"
        fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Clean peak markers - true concentric crests (solid black) -->
  <circle cx="685" cy="170" r="6" fill="#111111" stroke="#000000" stroke-width="2"/>
  <circle cx="865" cy="150" r="6" fill="#111111" stroke="#000000" stroke-width="2"/>

  <!-- Concentric labels -->
  <line x1="685" y1="162" x2="685" y2="128" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="685" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Concêntrica ↑</text>

  <line x1="865" y1="142" x2="865" y2="128" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="865" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Concêntrica ↑</text>

  <!-- Eccentric valley labels (hollow circles) -->
  <circle cx="615" cy="370" r="4.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="615" y="395" text-anchor="middle" font-size="9" fill="#374151">Excêntrica ↓</text>
  <circle cx="780" cy="360" r="4.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <text x="780" y="395" text-anchor="middle" font-size="9" fill="#374151">Excêntrica ↓</text>

  <!-- Result box -->
  <rect x="550" y="415" width="330" height="34" rx="4" fill="#F3F4F6" stroke="#111111" stroke-width="1.5"/>
  <text x="715" y="436" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">
    [✓] Detecção exata: 2 cristas para 2 repetições reais
  </text>

  <!-- Positive/Negative zones for PCA -->
  <text x="890" y="200" font-size="11" fill="#111111" font-weight="bold">+</text>
  <text x="890" y="345" font-size="12" fill="#111111" font-weight="bold">−</text>
</svg>
